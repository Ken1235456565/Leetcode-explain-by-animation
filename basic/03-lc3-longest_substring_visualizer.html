<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最长无重复字符子串 · 滑动窗口分步演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b132b;
    --panel: #121a3a;
    --panel-border: #26315e;
    --ink: #e8eef4;
    --ink-dim: #93a1c2;
    --box: #1a2350;
    --box-dim: #14193a;
    --left-color: #f9a826;
    --right-color: #3ddc97;
    --window: #5bc0eb;
    --window-soft: rgba(91,192,235,0.15);
    --dup: #f96e6e;
    --best: #ffd166;
    --accent: #5bc0eb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: radial-gradient(ellipse at top, #101a3f 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    padding: 28px 20px 60px;
    min-height: 100vh;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  header { margin-bottom: 22px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing: 0.14em;
    color: var(--accent); text-transform: uppercase;
  }
  h1 { font-size: 26px; font-weight: 700; margin: 6px 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-dim); font-size: 14px; line-height: 1.6; }

  .grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 18px; margin-top: 22px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 18px 18px 20px;
  }
  .panel h2 {
    font-size: 13px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink-dim); margin: 0 0 12px;
  }

  .stage-svg { width: 100%; height: auto; display: block; }

  .input-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  input[type=text] {
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    color: var(--ink); background: #0e1636; border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 9px 12px; flex: 1; min-width: 180px;
  }
  .controls { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button {
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    color: var(--ink); background: #1a2350; border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 9px 14px; cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover:not(:disabled) { background: #232d5e; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #051424; border-color: var(--accent); }
  button.primary:hover:not(:disabled) { background: #8fd8f5; }

  .step-counter {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--ink-dim); margin-left: auto; white-space: nowrap;
  }

  .desc-box {
    margin-top: 16px; padding: 13px 15px; background: #0e1636;
    border: 1px solid var(--panel-border); border-left: 3px solid var(--accent);
    border-radius: 8px; font-size: 13.5px; line-height: 1.7; color: var(--ink);
    min-height: 60px;
  }

  .chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 14px; }
  @media (max-width: 560px) { .chips { grid-template-columns: repeat(3, 1fr); } }
  .chip {
    background: #0e1636; border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 8px 6px; text-align: center;
  }
  .chip .label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-dim); letter-spacing: 0.04em; }
  .chip .value { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; margin-top: 2px; }
  .chip.left .value { color: var(--left-color); }
  .chip.right .value { color: var(--right-color); }
  .chip.win .value { color: var(--window); font-size: 14px; }
  .chip.len .value { color: var(--ink); }
  .chip.ans .value { color: var(--best); }

  .code-box {
    background: #0a1130; border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 10px 0;
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    line-height: 1.85; overflow-x: auto;
  }
  .line { display: flex; padding: 0 14px; white-space: pre; border-left: 3px solid transparent; color: #a9b4d6; }
  .line .ln { width: 26px; flex: 0 0 26px; color: #4a5580; user-select: none; }
  .line.active { background: rgba(91, 192, 235, 0.12); border-left: 3px solid var(--accent); color: var(--ink); }
  .line.active .ln { color: var(--accent); }

  .legend { display: flex; gap: 16px; margin-top: 14px; font-size: 12px; color: var(--ink-dim); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Sliding Window · O(n) / O(k)</div>
    <h1>最长无重复字符子串 —— 滑动窗口分步演示</h1>
    <div class="sub">窗口内维护一段无重复字符。right 向右扩展，若新字符已在窗口中，就从 left 逐个移出字符直到重复消失，再纳入新字符并更新最长长度。</div>
  </header>

  <div class="grid">

    <div class="panel">
      <h2>字符串演示</h2>

      <div class="input-row">
        <input type="text" id="input-str" value="abcabcbb" maxlength="26" />
        <button id="btn-run" class="primary">运行这个字符串</button>
      </div>

      <svg class="stage-svg" viewBox="0 0 920 220" id="stage"></svg>

      <div class="legend">
        <span><i class="dot" style="background:var(--left-color)"></i>left（窗口左端）</span>
        <span><i class="dot" style="background:var(--right-color)"></i>right（窗口右端）</span>
        <span><i class="dot" style="background:var(--dup)"></i>重复字符</span>
        <span><i class="dot" style="background:var(--best)"></i>刷新最长长度</span>
      </div>

      <div class="chips">
        <div class="chip left"><div class="label">LEFT</div><div class="value" id="chip-left">-</div></div>
        <div class="chip right"><div class="label">RIGHT</div><div class="value" id="chip-right">-</div></div>
        <div class="chip win"><div class="label">窗口内容</div><div class="value" id="chip-win">-</div></div>
        <div class="chip len"><div class="label">窗口长度</div><div class="value" id="chip-len">-</div></div>
        <div class="chip ans"><div class="label">ANS（最长）</div><div class="value" id="chip-ans">0</div></div>
      </div>

      <div class="desc-box" id="desc-box">加载中。</div>

      <div class="controls">
        <button id="btn-reset">重置</button>
        <button id="btn-prev">上一步</button>
        <button id="btn-play" class="primary">播放</button>
        <button id="btn-next">下一步</button>
        <div class="step-counter" id="step-counter">步骤 0 / 0</div>
      </div>
    </div>

    <div class="panel">
      <h2>对应源代码</h2>
      <div class="code-box" id="code-box"></div>
    </div>

  </div>
</div>

<script>
(function () {
  const codeLines = [
    "class Solution:",
    "    def lengthOfLongestSubstring(self, s: str) -> int:",
    "        window = set()      # 当前窗口内的字符",
    "        left = 0",
    "        ans = 0",
    "        for right in range(len(s)):",
    "            while s[right] in window:   # 出现重复，收缩",
    "                window.remove(s[left])",
    "                left += 1",
    "            window.add(s[right])        # 纳入新字符",
    "            ans = max(ans, right - left + 1)",
    "        return ans"
  ];

  function simulate(s) {
    const n = s.length;
    const steps = [];
    const win = new Set();
    let left = 0, ans = 0;

    steps.push({
      type: "init", left: 0, right: -1, ans: 0, win: "",
      lines: [3, 4, 5, 6],
      desc: 's = "' + s + '"。窗口集合 window 为空，left=0，ans=0。right 将从左到右扩展窗口。'
    });

    for (let right = 0; right < n; right++) {
      const ch = s[right];

      while (win.has(ch)) {
        const removed = s[left];
        steps.push({
          type: "shrink", left, right, ch, removed, win: [...win].join(""),
          lines: [6, 7, 8, 9],
          desc: "right=" + right + " 的字符 '" + ch + "' 已在窗口中，出现重复。移出左端 s[" + left + "]='" +
                removed + "'，left 右移到 " + (left + 1) + "，继续检查是否还重复。"
        });
        win.delete(removed);
        left += 1;
      }

      win.add(ch);
      const len = right - left + 1;
      const better = len > ans;
      const oldAns = ans;
      if (better) ans = len;

      steps.push({
        type: "add", left, right, ch, len, ans, better, win: [...win].join(""),
        lines: [6, 10, 11],
        desc: "把 '" + ch + "' 纳入窗口，当前窗口为 \"" + s.slice(left, right + 1) + "\"，长度 " + len +
              (better ? "，比之前更长，刷新 ans = " + len + "。" : "，未超过当前 ans(" + oldAns + ")。")
      });
    }

    steps.push({
      type: "final", ans, left, right: n - 1,
      lines: [12],
      desc: "遍历结束，最长无重复字符子串的长度为 " + ans + "。"
    });

    return steps;
  }

  // ---- code panel (static) ----
  const codeBox = document.getElementById("code-box");
  codeLines.forEach((text, i) => {
    const row = document.createElement("div");
    row.className = "line";
    row.id = "line-" + (i + 1);
    row.innerHTML = '<span class="ln">' + (i + 1) + '</span><span class="code">' + text.replace(/</g, "&lt;") + "</span>";
    codeBox.appendChild(row);
  });

  function highlightLines(lines) {
    codeLines.forEach((_, i) => {
      document.getElementById("line-" + (i + 1)).classList.remove("active");
    });
    lines.forEach((ln) => {
      const el = document.getElementById("line-" + ln);
      if (el) el.classList.add("active");
    });
  }

  // ---- dynamic state ----
  let s = "abcabcbb";
  let steps = simulate(s);
  let current = 0;
  let playTimer = null;

  function renderStage(step) {
    const n = s.length;
    const parts = [];
    const boxSize = Math.min(64, Math.floor(840 / n) - 8);
    const gap = 10;
    const totalW = n * (boxSize + gap) - gap;
    const startX = (920 - totalW) / 2;
    const boxY = 76;

    function bx(idx) { return startX + idx * (boxSize + gap); }

    const left = step.left, right = step.right;
    const windowActive = right >= 0 && left <= right && step.type !== "final";

    // window band
    if (windowActive) {
      const b0 = bx(left) - gap / 2;
      const b1 = bx(right) + boxSize + gap / 2;
      const bandColor = step.better ? "rgba(255,209,102,0.16)" : "var(--window-soft)";
      const bandStroke = step.better ? "var(--best)" : "var(--window)";
      parts.push(
        '<rect x="' + b0 + '" y="' + (boxY - 10) + '" width="' + (b1 - b0) + '" height="' + (boxSize + 20) +
        '" rx="12" fill="' + bandColor + '" stroke="' + bandStroke + '" stroke-width="1.6" stroke-dasharray="6,4"/>'
      );
      parts.push(
        '<text x="' + ((b0 + b1) / 2) + '" y="' + (boxY - 18) + '" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="' + bandStroke +
        '" text-anchor="middle">窗口 "' + s.slice(left, right + 1) + '"，长度 ' + (right - left + 1) + '</text>'
      );
    }

    // boxes
    for (let idx = 0; idx < n; idx++) {
      const x = bx(idx);
      const ch = s[idx];
      const inWindow = windowActive && idx >= left && idx <= right;
      const isLeft = windowActive && idx === left;
      const isRight = windowActive && idx === right;
      // duplicate highlight: on shrink step, the char being removed and the incoming right char
      const isDupIncoming = step.type === "shrink" && idx === right;
      const isBeingRemoved = step.type === "shrink" && idx === left;

      let fill = inWindow ? "var(--box)" : "var(--box-dim)";
      let opacity = inWindow ? "1" : "0.42";
      let stroke = "#2c3766", strokeWidth = "1";

      if (isDupIncoming) { stroke = "var(--dup)"; strokeWidth = "3"; fill = "rgba(249,110,110,0.16)"; opacity = "1"; }
      else if (isBeingRemoved) { stroke = "var(--dup)"; strokeWidth = "2.5"; }
      else if (isLeft && isRight) { stroke = "var(--window)"; strokeWidth = "2.5"; }
      else if (isLeft) { stroke = "var(--left-color)"; strokeWidth = "2.5"; }
      else if (isRight) { stroke = "var(--right-color)"; strokeWidth = "2.5"; }

      parts.push(
        '<rect x="' + x + '" y="' + boxY + '" width="' + boxSize + '" height="' + boxSize +
        '" rx="10" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + strokeWidth + '" opacity="' + opacity + '"/>'
      );
      parts.push(
        '<text x="' + (x + boxSize / 2) + '" y="' + (boxY + boxSize / 2 + 6) + '" font-family="JetBrains Mono, monospace" font-size="' + Math.min(22, boxSize * 0.42) +
        '" font-weight="700" fill="var(--ink)" text-anchor="middle" opacity="' + opacity + '">' + ch + '</text>'
      );
      parts.push(
        '<text x="' + (x + boxSize / 2) + '" y="' + (boxY + boxSize + 16) + '" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--ink-dim)" text-anchor="middle">' + idx + '</text>'
      );
    }

    // pointer arrows
    if (windowActive) {
      const ay = boxY + boxSize + 38;
      const lx = bx(left) + boxSize / 2;
      const rx = bx(right) + boxSize / 2;
      if (left === right) {
        parts.push('<text x="' + lx + '" y="' + ay + '" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--window)" text-anchor="middle">▲</text>');
        parts.push('<text x="' + lx + '" y="' + (ay + 14) + '" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--window)" text-anchor="middle">l,r</text>');
      } else {
        parts.push('<text x="' + lx + '" y="' + ay + '" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--left-color)" text-anchor="middle">▲</text>');
        parts.push('<text x="' + lx + '" y="' + (ay + 14) + '" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--left-color)" text-anchor="middle">left</text>');
        parts.push('<text x="' + rx + '" y="' + ay + '" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--right-color)" text-anchor="middle">▲</text>');
        parts.push('<text x="' + rx + '" y="' + (ay + 14) + '" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--right-color)" text-anchor="middle">right</text>');
      }
    }

    if (step.type === "final") {
      parts.push('<rect x="345" y="' + (boxY + 14) + '" width="230" height="34" rx="17" fill="rgba(255,209,102,0.10)" stroke="var(--best)" stroke-width="1.3"/>');
      parts.push('<text x="460" y="' + (boxY + 36) + '" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="var(--best)" text-anchor="middle">返回最长长度 = ' + step.ans + '</text>');
    }

    document.getElementById("stage").innerHTML = parts.join("");
  }

  function render() {
    const step = steps[current];

    renderStage(step);
    highlightLines(step.lines);

    document.getElementById("chip-left").textContent = step.left !== undefined ? step.left : "—";
    document.getElementById("chip-right").textContent = (step.right !== undefined && step.right >= 0) ? step.right : "—";
    document.getElementById("chip-win").textContent = (step.type !== "final")
      ? ('"' + (step.right >= 0 && step.left <= step.right ? s.slice(step.left, step.right + 1) : "") + '"') : "—";
    const lenEl = document.getElementById("chip-len");
    lenEl.textContent = (step.right !== undefined && step.right >= 0 && step.left <= step.right && step.type !== "final")
      ? (step.right - step.left + 1) : "—";
    document.getElementById("chip-ans").textContent = step.ans !== undefined ? step.ans : 0;

    document.getElementById("desc-box").textContent = step.desc;
    document.getElementById("step-counter").textContent = "步骤 " + current + " / " + (steps.length - 1);

    document.getElementById("btn-prev").disabled = current === 0;
    document.getElementById("btn-next").disabled = current === steps.length - 1;
  }

  function stopPlay() {
    if (playTimer) { clearInterval(playTimer); playTimer = null; document.getElementById("btn-play").textContent = "播放"; }
  }

  function reloadWith(newStr) {
    stopPlay();
    s = newStr.length ? newStr : " ";
    steps = simulate(s);
    current = 0;
    render();
  }

  document.getElementById("btn-run").addEventListener("click", () => {
    reloadWith(document.getElementById("input-str").value);
  });
  document.getElementById("input-str").addEventListener("keydown", (e) => {
    if (e.key === "Enter") reloadWith(document.getElementById("input-str").value);
  });

  document.getElementById("btn-next").addEventListener("click", () => {
    if (current < steps.length - 1) { current++; render(); }
    if (current === steps.length - 1) stopPlay();
  });
  document.getElementById("btn-prev").addEventListener("click", () => {
    stopPlay(); if (current > 0) { current--; render(); }
  });
  document.getElementById("btn-reset").addEventListener("click", () => {
    stopPlay(); current = 0; render();
  });
  document.getElementById("btn-play").addEventListener("click", () => {
    if (playTimer) { stopPlay(); return; }
    document.getElementById("btn-play").textContent = "暂停";
    playTimer = setInterval(() => {
      if (current < steps.length - 1) { current++; render(); } else stopPlay();
    }, 1300);
  });
  document.addEventListener("keydown", (e) => {
    if (document.activeElement && document.activeElement.id === "input-str") return;
    if (e.key === "ArrowRight") document.getElementById("btn-next").click();
    if (e.key === "ArrowLeft") document.getElementById("btn-prev").click();
  });

  render();
})();
</script>
</body>
</html>
