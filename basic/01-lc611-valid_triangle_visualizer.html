<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>有效三角形的个数 · 双指针分步演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b132b;
    --panel: #121a3a;
    --panel-border: #26315e;
    --ink: #e8eef4;
    --ink-dim: #93a1c2;
    --box: #1a2350;
    --box-dim: #14193a;
    --i-color: #3ddc97;
    --j-color: #f9a826;
    --k-color: #c86bfa;
    --ok: #6ee7a0;
    --no: #f96e6e;
    --band: rgba(110,231,160,0.16);
    --accent: #5bc0eb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: radial-gradient(ellipse at top, #101a3f 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    padding: 28px 20px 60px;
    min-height: 100vh;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  header { margin-bottom: 22px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--accent);
    text-transform: uppercase;
  }
  h1 { font-size: 26px; font-weight: 700; margin: 6px 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-dim); font-size: 14px; line-height: 1.6; }

  .grid {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 18px;
    margin-top: 22px;
  }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 18px 18px 20px;
  }
  .panel h2 {
    font-size: 13px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink-dim); margin: 0 0 12px;
  }

  .stage-svg { width: 100%; height: auto; display: block; }

  .controls { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button {
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    color: var(--ink); background: #1a2350; border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 9px 14px; cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover:not(:disabled) { background: #232d5e; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #051424; border-color: var(--accent); }
  button.primary:hover:not(:disabled) { background: #8fd8f5; }

  .step-counter {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--ink-dim); margin-left: auto; white-space: nowrap;
  }

  .desc-box {
    margin-top: 16px; padding: 13px 15px; background: #0e1636;
    border: 1px solid var(--panel-border); border-left: 3px solid var(--accent);
    border-radius: 8px; font-size: 13.5px; line-height: 1.7; color: var(--ink);
    min-height: 78px;
  }

  .chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 14px; }
  @media (max-width: 560px) { .chips { grid-template-columns: repeat(3, 1fr); } }
  .chip {
    background: #0e1636; border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 8px 6px; text-align: center;
  }
  .chip .label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--ink-dim); letter-spacing: 0.04em;
  }
  .chip .value { font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700; margin-top: 2px; }
  .chip.k .value { color: var(--k-color); }
  .chip.i .value { color: var(--i-color); }
  .chip.j .value { color: var(--j-color); }
  .chip.sum .value { color: var(--accent); }
  .chip.ans .value { color: var(--ok); }

  .code-box {
    background: #0a1130; border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 10px 0;
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    line-height: 1.85; overflow-x: auto;
  }
  .line { display: flex; padding: 0 14px; white-space: pre; border-left: 3px solid transparent; color: #a9b4d6; }
  .line .ln { width: 26px; flex: 0 0 26px; color: #4a5580; user-select: none; }
  .line.active { background: rgba(91, 192, 235, 0.12); border-left: 3px solid var(--accent); color: var(--ink); }
  .line.active .ln { color: var(--accent); }

  .legend { display: flex; gap: 16px; margin-top: 14px; font-size: 12px; color: var(--ink-dim); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Sorting + Two Pointers · O(n²) / O(1)</div>
    <h1>有效三角形的个数 —— 排序 + 双指针分步演示</h1>
    <div class="sub">排序后固定最大边 nums[k]，用 i、j 双指针查找另两条较短边。只要较短两边之和大于最大边即可成三角形，一次统计一批组合。</div>
  </header>

  <div class="grid">

    <div class="panel">
      <h2>数组演示</h2>
      <svg class="stage-svg" viewBox="0 0 940 270" id="stage"></svg>

      <div class="legend">
        <span><i class="dot" style="background:var(--i-color)"></i>i 指针（较短边）</span>
        <span><i class="dot" style="background:var(--j-color)"></i>j 指针（较短边）</span>
        <span><i class="dot" style="background:var(--k-color)"></i>k 指针（最大边）</span>
        <span><i class="dot" style="background:var(--ok)"></i>本步新增的三元组</span>
      </div>

      <div class="chips">
        <div class="chip k"><div class="label">K（最大边）</div><div class="value" id="chip-k">-</div></div>
        <div class="chip i"><div class="label">I</div><div class="value" id="chip-i">-</div></div>
        <div class="chip j"><div class="label">J</div><div class="value" id="chip-j">-</div></div>
        <div class="chip sum"><div class="label">nums[i]+nums[j]</div><div class="value" id="chip-sum">-</div></div>
        <div class="chip ans"><div class="label">ANS</div><div class="value" id="chip-ans">0</div></div>
      </div>

      <div class="desc-box" id="desc-box">加载中。</div>

      <div class="controls">
        <button id="btn-reset">重置</button>
        <button id="btn-prev">上一步</button>
        <button id="btn-play" class="primary">播放</button>
        <button id="btn-next">下一步</button>
        <div class="step-counter" id="step-counter">步骤 0 / 0</div>
      </div>
    </div>

    <div class="panel">
      <h2>对应源代码</h2>
      <div class="code-box" id="code-box"></div>
    </div>

  </div>
</div>

<script>
(function () {
  const inputNums = [1, 2, 3, 4, 5, 6];

  const codeLines = [
    "class Solution:",
    "    def triangleNumber(self, nums: List[int]) -> int:",
    "        nums.sort()",
    "        n = len(nums)",
    "        ans = 0",
    "        for k in range(2, n):        # 固定最大边 nums[k]",
    "            i = 0",
    "            j = k - 1",
    "            while i < j:",
    "                if nums[i] + nums[j] > nums[k]:",
    "                    # i..j-1 配 j 都能成三角形",
    "                    ans += j - i",
    "                    j -= 1",
    "                else:",
    "                    i += 1",
    "        return ans"
  ];

  function simulate(input) {
    const nums = input.slice().sort((a, b) => a - b);
    const n = nums.length;
    const steps = [];
    let ans = 0;

    steps.push({
      type: "init", nums: nums.slice(),
      lines: [3, 4, 5],
      desc: "排序后 nums 为 [" + nums.join(", ") + "]。排序保证 nums[k] 是当前三元组的最大边，只需判断另两边之和是否大于它。"
    });

    for (let k = 2; k < n; k++) {
      let i = 0, j = k - 1;
      steps.push({
        type: "k-set", k, i, j, ans,
        lines: [6, 7, 8, 9],
        desc: "固定最大边 k=" + k + "（nums[k]=" + nums[k] + "），令 i=0，j=k-1=" + j + "，在 [i, j] 内查找较短两边。"
      });

      while (i < j) {
        const sum = nums[i] + nums[j];
        if (sum > nums[k]) {
          const added = j - i;
          ans += added;
          steps.push({
            type: "iter", branch: "ok", k, i, j, sum, added, ans,
            lines: [9, 10, 11, 12, 13],
            desc: "nums[i]+nums[j] = " + nums[i] + " + " + nums[j] + " = " + sum +
                  " > nums[k]=" + nums[k] + "。因为数组有序，i 到 j-1 之间每个下标与 j、k 都能成三角形，一次增加 " +
                  added + " 个（j - i）。随后 j 左移一位。"
          });
          j -= 1;
        } else {
          steps.push({
            type: "iter", branch: "no", k, i, j, sum, ans,
            lines: [9, 10, 14, 15],
            desc: "nums[i]+nums[j] = " + nums[i] + " + " + nums[j] + " = " + sum +
                  " 不大于 nums[k]=" + nums[k] + "，当前 i 太小无法成三角形，i 右移一位。"
          });
          i += 1;
        }
      }
    }

    steps.push({
      type: "final", ans,
      lines: [16],
      desc: "所有最大边都枚举完毕，返回能构成三角形的三元组总数 ans = " + ans + "。"
    });

    return steps;
  }

  const steps = simulate(inputNums);
  const sortedNums = steps[0].nums;
  const n = sortedNums.length;
  let current = 0;
  let playTimer = null;

  // ---- code panel ----
  const codeBox = document.getElementById("code-box");
  codeLines.forEach((text, i) => {
    const row = document.createElement("div");
    row.className = "line";
    row.id = "line-" + (i + 1);
    row.innerHTML = '<span class="ln">' + (i + 1) + '</span><span class="code">' + text.replace(/</g, "&lt;") + "</span>";
    codeBox.appendChild(row);
  });

  function highlightLines(lines) {
    codeLines.forEach((_, i) => {
      document.getElementById("line-" + (i + 1)).classList.remove("active");
    });
    lines.forEach((ln) => {
      const el = document.getElementById("line-" + ln);
      if (el) el.classList.add("active");
    });
  }

  // ---- SVG stage geometry ----
  const boxSize = 60, gap = 18, startX = 60;
  const boxY = 84;

  function boxX(idx) { return startX + idx * (boxSize + gap); }

  function renderStage(step) {
    const parts = [];
    const k = step.k, i = step.i, j = step.j;
    const hasIJ = i !== undefined && j !== undefined;

    // band highlighting i..j-1 that all form triangles on an "ok" step
    if (step.branch === "ok" && step.added > 0) {
      const bx = boxX(i) - gap / 2;
      const bw = (boxX(j) + boxSize) - bx;
      parts.push(
        '<rect x="' + bx + '" y="' + (boxY - 8) + '" width="' + bw + '" height="' + (boxSize + 16) +
        '" rx="12" fill="var(--band)" stroke="var(--ok)" stroke-width="1.4" stroke-dasharray="6,4"/>'
      );
      parts.push(
        '<text x="' + ((boxX(i) + boxX(j) + boxSize) / 2) + '" y="' + (boxY - 16) +
        '" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="var(--ok)" text-anchor="middle">+' + step.added + ' 个三元组</text>'
      );
    }

    // sum comparison text near i and j
    if (step.sum !== undefined && hasIJ) {
      const xi = boxX(i) + boxSize / 2;
      const xj = boxX(j) + boxSize / 2;
      const brY = boxY + boxSize + 44;
      let col = "var(--ok)", sym = ">";
      if (step.branch === "no") { col = "var(--no)"; sym = "≤"; }
      parts.push(
        '<path d="M ' + xi + ' ' + (boxY + boxSize) + ' L ' + xi + ' ' + brY + ' L ' + xj + ' ' + brY + ' L ' + xj + ' ' + (boxY + boxSize) +
        '" fill="none" stroke="' + col + '" stroke-width="1.5" opacity="0.7"/>'
      );
      parts.push(
        '<text x="' + ((xi + xj) / 2) + '" y="' + (brY + 16) + '" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="' + col +
        '" text-anchor="middle">' + sortedNums[i] + ' + ' + sortedNums[j] + ' = ' + step.sum + '  ' + sym + '  nums[k]=' + sortedNums[k] + '</text>'
      );
    }

    // boxes
    for (let idx = 0; idx < n; idx++) {
      const x = boxX(idx);
      let inWindow = true;
      if (hasIJ) inWindow = (idx >= i && idx <= j) || idx === k;

      let fill = inWindow ? "var(--box)" : "var(--box-dim)";
      let opacity = inWindow ? "1" : "0.32";
      let stroke = "#2c3766";
      let strokeWidth = "1";
      if (idx === k) { stroke = "var(--k-color)"; strokeWidth = "2.5"; }
      else if (idx === i && hasIJ) { stroke = "var(--i-color)"; strokeWidth = "2.5"; }
      else if (idx === j && hasIJ) { stroke = "var(--j-color)"; strokeWidth = "2.5"; }

      parts.push(
        '<rect x="' + x + '" y="' + boxY + '" width="' + boxSize + '" height="' + boxSize +
        '" rx="9" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + strokeWidth + '" opacity="' + opacity + '"/>'
      );
      parts.push(
        '<text x="' + (x + boxSize / 2) + '" y="' + (boxY + boxSize / 2 + 6) + '" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700" fill="var(--ink)" text-anchor="middle" opacity="' + opacity + '">' + sortedNums[idx] + '</text>'
      );
      parts.push(
        '<text x="' + (x + boxSize / 2) + '" y="' + (boxY + boxSize + 16) + '" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--ink-dim)" text-anchor="middle">' + idx + '</text>'
      );
    }

    // pointer arrows above
    if (k !== undefined) {
      const arrowY = boxY - 30;
      const groups = {};
      const pts = [
        { idx: i, color: "var(--i-color)", label: "i" },
        { idx: j, color: "var(--j-color)", label: "j" },
        { idx: k, color: "var(--k-color)", label: "k" }
      ];
      pts.forEach((p) => {
        if (p.idx === undefined) return;
        if (!groups[p.idx]) groups[p.idx] = [];
        groups[p.idx].push(p);
      });
      Object.keys(groups).forEach((idx) => {
        const g = groups[idx];
        const px = boxX(parseInt(idx)) + boxSize / 2;
        parts.push(
          '<text x="' + px + '" y="' + arrowY + '" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="' + g[0].color + '" text-anchor="middle">▼</text>'
        );
        parts.push(
          '<text x="' + px + '" y="' + (arrowY - 12) + '" font-family="JetBrains Mono, monospace" font-size="11" fill="' + g[0].color + '" text-anchor="middle">' + g.map(x => x.label).join(",") + '</text>'
        );
      });
    } else if (step.type === "init") {
      parts.push(
        '<text x="470" y="' + (boxY - 30) + '" font-family="JetBrains Mono, monospace" font-size="13" fill="var(--ink-dim)" text-anchor="middle">三角形条件：较短两边之和 &gt; 最大边</text>'
      );
    }

    document.getElementById("stage").innerHTML = parts.join("");
  }

  function render() {
    const step = steps[current];

    renderStage(step);
    highlightLines(step.lines);

    document.getElementById("chip-k").textContent = step.k !== undefined ? step.k : "—";
    document.getElementById("chip-i").textContent = step.i !== undefined ? step.i : "—";
    document.getElementById("chip-j").textContent = step.j !== undefined ? step.j : "—";
    document.getElementById("chip-sum").textContent = step.sum !== undefined ? step.sum : "—";
    document.getElementById("chip-ans").textContent = step.ans !== undefined ? step.ans : (step.type === "init" ? 0 : "—");

    document.getElementById("desc-box").textContent = step.desc;
    document.getElementById("step-counter").textContent = "步骤 " + current + " / " + (steps.length - 1);

    document.getElementById("btn-prev").disabled = current === 0;
    document.getElementById("btn-next").disabled = current === steps.length - 1;
  }

  function stopPlay() {
    if (playTimer) { clearInterval(playTimer); playTimer = null; document.getElementById("btn-play").textContent = "播放"; }
  }

  document.getElementById("btn-next").addEventListener("click", () => {
    if (current < steps.length - 1) { current++; render(); }
    if (current === steps.length - 1) stopPlay();
  });
  document.getElementById("btn-prev").addEventListener("click", () => {
    stopPlay(); if (current > 0) { current--; render(); }
  });
  document.getElementById("btn-reset").addEventListener("click", () => {
    stopPlay(); current = 0; render();
  });
  document.getElementById("btn-play").addEventListener("click", () => {
    if (playTimer) { stopPlay(); return; }
    document.getElementById("btn-play").textContent = "暂停";
    playTimer = setInterval(() => {
      if (current < steps.length - 1) { current++; render(); } else stopPlay();
    }, 1500);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") document.getElementById("btn-next").click();
    if (e.key === "ArrowLeft") document.getElementById("btn-prev").click();
  });

  render();
})();
</script>
</body>
</html>
