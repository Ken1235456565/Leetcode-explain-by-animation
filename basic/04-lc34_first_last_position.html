<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>查找元素的第一个和最后一个位置 · 二分查找分步演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b132b;
    --panel: #121a3a;
    --panel-border: #26315e;
    --ink: #e8eef4;
    --ink-dim: #93a1c2;
    --box: #1a2350;
    --box-dim: #14193a;
    --lo-color: #f9a826;
    --hi-color: #3ddc97;
    --mid-color: #5bc0eb;
    --window-soft: rgba(91,192,235,0.15);
    --over: #f96e6e;
    --best: #ffd166;
    --accent: #5bc0eb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: radial-gradient(ellipse at top, #101a3f 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    padding: 28px 20px 60px;
    min-height: 100vh;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  header { margin-bottom: 22px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing: 0.14em;
    color: var(--accent); text-transform: uppercase;
  }
  h1 { font-size: 25px; font-weight: 700; margin: 6px 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-dim); font-size: 14px; line-height: 1.6; }

  .grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 18px; margin-top: 22px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 18px 18px 20px;
  }
  .panel h2 {
    font-size: 13px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink-dim); margin: 0 0 12px;
  }

  .stage-svg { width: 100%; height: auto; display: block; }

  .input-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  input[type=text] {
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    color: var(--ink); background: #0e1636; border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 9px 12px; flex: 1; min-width: 160px;
  }
  input.target-input { flex: 0 0 90px; min-width: 70px; }
  .controls { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button {
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    color: var(--ink); background: #1a2350; border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 9px 14px; cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover:not(:disabled) { background: #232d5e; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #051424; border-color: var(--accent); }
  button.primary:hover:not(:disabled) { background: #8fd8f5; }

  .step-counter {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--ink-dim); margin-left: auto; white-space: nowrap;
  }

  .phase-tag {
    display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 11px;
    font-weight: 700; letter-spacing: 0.06em; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--panel-border); color: var(--ink-dim); margin-bottom: 10px;
  }
  .phase-tag.first { color: var(--lo-color); border-color: var(--lo-color); background: rgba(249,168,38,0.10); }
  .phase-tag.last { color: var(--hi-color); border-color: var(--hi-color); background: rgba(61,220,151,0.10); }

  .desc-box {
    margin-top: 12px; padding: 13px 15px; background: #0e1636;
    border: 1px solid var(--panel-border); border-left: 3px solid var(--accent);
    border-radius: 8px; font-size: 13.5px; line-height: 1.7; color: var(--ink);
    min-height: 60px;
  }

  .chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 14px; }
  @media (max-width: 640px) { .chips { grid-template-columns: repeat(3, 1fr); } }
  .chip {
    background: #0e1636; border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 8px 6px; text-align: center;
  }
  .chip .label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-dim); letter-spacing: 0.04em; }
  .chip .value { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; margin-top: 2px; }
  .chip.lo .value { color: var(--lo-color); }
  .chip.hi .value { color: var(--hi-color); }
  .chip.mid .value { color: var(--mid-color); }
  .chip.res .value { color: var(--best); }

  .code-box {
    background: #0a1130; border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 10px 0;
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    line-height: 1.85; overflow-x: auto;
  }
  .line { display: flex; padding: 0 14px; white-space: pre; border-left: 3px solid transparent; color: #a9b4d6; }
  .line .ln { width: 26px; flex: 0 0 26px; color: #4a5580; user-select: none; }
  .line.active { background: rgba(91, 192, 235, 0.12); border-left: 3px solid var(--accent); color: var(--ink); }
  .line.active .ln { color: var(--accent); }

  .legend { display: flex; gap: 16px; margin-top: 14px; font-size: 12px; color: var(--ink-dim); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Binary Search · O(log n)</div>
    <h1>查找元素的第一个和最后一个位置 —— 二分查找分步演示</h1>
    <div class="sub">用两轮二分查找分别定位 target 的最左边界和最右边界。每轮二分中，若 nums[mid] 等于 target 就先记下 res，再根据找的是左边界还是右边界，继续向同一侧收缩查找范围；若 nums[mid] 偏小则收缩到右半区，偏大则收缩到左半区。</div>
  </header>

  <div class="grid">

    <div class="panel">
      <h2>数组演示</h2>

      <div class="input-row">
        <input type="text" id="input-arr" value="5,7,7,8,8,10" maxlength="60" />
        <input type="text" id="input-target" class="target-input" value="8" maxlength="8" />
        <button id="btn-run" class="primary">运行该输入</button>
      </div>

      <svg class="stage-svg" viewBox="0 0 920 210" id="stage"></svg>

      <div class="legend">
        <span><i class="dot" style="background:var(--lo-color)"></i>lo</span>
        <span><i class="dot" style="background:var(--hi-color)"></i>hi</span>
        <span><i class="dot" style="background:var(--mid-color)"></i>mid</span>
        <span><i class="dot" style="background:var(--best)"></i>nums[mid] == target，记录 res</span>
      </div>

      <div style="margin-top:14px;">
        <span class="phase-tag" id="phase-tag">阶段</span>
      </div>

      <div class="chips">
        <div class="chip lo"><div class="label">LO</div><div class="value" id="chip-lo">-</div></div>
        <div class="chip hi"><div class="label">HI</div><div class="value" id="chip-hi">-</div></div>
        <div class="chip mid"><div class="label">MID</div><div class="value" id="chip-mid">-</div></div>
        <div class="chip res"><div class="label">当前 RES</div><div class="value" id="chip-res">-1</div></div>
        <div class="chip res"><div class="label">最终答案</div><div class="value" id="chip-ans">-</div></div>
      </div>

      <div class="desc-box" id="desc-box">加载中。</div>

      <div class="controls">
        <button id="btn-reset">重置</button>
        <button id="btn-prev">上一步</button>
        <button id="btn-play" class="primary">播放</button>
        <button id="btn-next">下一步</button>
        <div class="step-counter" id="step-counter">步骤 0 / 0</div>
      </div>
    </div>

    <div class="panel">
      <h2>对应源代码</h2>
      <div class="code-box" id="code-box"></div>
    </div>

  </div>
</div>

<script>
(function () {
  const codeLines = [
    "class Solution:",
    "    def searchRange(self, nums: List[int], target: int) -> List[int]:",
    "        def findBound(isFirst):",
    "            lo, hi = 0, len(nums) - 1",
    "            res = -1",
    "            while lo <= hi:",
    "                mid = (lo + hi) // 2",
    "                if nums[mid] == target:",
    "                    res = mid",
    "                    if isFirst:",
    "                        hi = mid - 1",
    "                    else:",
    "                        lo = mid + 1",
    "                elif nums[mid] < target:",
    "                    lo = mid + 1",
    "                else:",
    "                    hi = mid - 1",
    "            return res",
    "        first = findBound(True)",
    "        if first == -1:",
    "            return [-1, -1]",
    "        last = findBound(False)",
    "        return [first, last]"
  ];

  function simulate(nums, target) {
    const n = nums.length;
    const steps = [];

    function runBound(isFirst) {
      let lo = 0, hi = n - 1, res = -1;

      steps.push({
        type: "phase-init", phase: isFirst ? "first" : "last", lo, hi, res,
        lines: [4, 5],
        desc: (isFirst ? "开始寻找 target 的最左边界。" : "已找到最左边界，重新初始化 lo、hi，开始寻找最右边界。") +
              " lo = 0，hi = " + hi + "，res = -1。"
      });

      while (lo <= hi) {
        const mid = Math.floor((lo + hi) / 2);
        steps.push({
          type: "mid", phase: isFirst ? "first" : "last", lo, hi, mid, res,
          lines: [7],
          desc: "计算 mid = (" + lo + " + " + hi + ") // 2 = " + mid + "，nums[" + mid + "] = " + nums[mid] + "，与 target(" + target + ") 比较。"
        });

        if (nums[mid] === target) {
          res = mid;
          if (isFirst) {
            hi = mid - 1;
            steps.push({
              type: "eq", phase: "first", lo, hi, mid, res,
              lines: [8, 9, 10, 11],
              desc: "nums[" + mid + "] == target，记录 res = " + mid + "。为了找更左的边界，收缩 hi = mid - 1 = " + hi + "，继续往左半区查找。"
            });
          } else {
            lo = mid + 1;
            steps.push({
              type: "eq", phase: "last", lo, hi, mid, res,
              lines: [8, 9, 12, 13],
              desc: "nums[" + mid + "] == target，记录 res = " + mid + "。为了找更右的边界，收缩 lo = mid + 1 = " + lo + "，继续往右半区查找。"
            });
          }
        } else if (nums[mid] < target) {
          lo = mid + 1;
          steps.push({
            type: "less", phase: isFirst ? "first" : "last", lo, hi, mid, res,
            lines: [14, 15],
            desc: "nums[" + mid + "](" + nums[mid] + ") 小于 target(" + target + ")，target 只可能在右半区，lo = mid + 1 = " + lo + "。"
          });
        } else {
          hi = mid - 1;
          steps.push({
            type: "greater", phase: isFirst ? "first" : "last", lo, hi, mid, res,
            lines: [16, 17],
            desc: "nums[" + mid + "](" + nums[mid] + ") 大于 target(" + target + ")，target 只可能在左半区，hi = mid - 1 = " + hi + "。"
          });
        }
      }

      steps.push({
        type: "phase-done", phase: isFirst ? "first" : "last", res,
        lines: [18],
        desc: "lo > hi，查找区间为空，本轮结束。" + (isFirst ? "最左边界 first = " : "最右边界 last = ") + res + "。"
      });

      return res;
    }

    const first = runBound(true);

    if (first === -1) {
      steps.push({
        type: "final", first: -1, last: -1,
        lines: [19, 20],
        desc: "first == -1，说明数组中不存在 target，直接返回 [-1, -1]。"
      });
      return steps;
    }

    const last = runBound(false);

    steps.push({
      type: "final", first, last,
      lines: [21, 22],
      desc: "first = " + first + "，last = " + last + "，返回 [" + first + ", " + last + "]。"
    });

    return steps;
  }

  // ---- code panel (static) ----
  const codeBox = document.getElementById("code-box");
  codeLines.forEach((text, i) => {
    const row = document.createElement("div");
    row.className = "line";
    row.id = "line-" + (i + 1);
    row.innerHTML = '<span class="ln">' + (i + 1) + '</span><span class="code">' + text.replace(/</g, "&lt;") + "</span>";
    codeBox.appendChild(row);
  });

  function highlightLines(lines) {
    codeLines.forEach((_, i) => {
      document.getElementById("line-" + (i + 1)).classList.remove("active");
    });
    lines.forEach((ln) => {
      const el = document.getElementById("line-" + ln);
      if (el) el.classList.add("active");
    });
  }

  // ---- dynamic state ----
  let nums = [5, 7, 7, 8, 8, 10];
  let target = 8;
  let steps = simulate(nums, target);
  let current = 0;
  let playTimer = null;

  function renderStage(step) {
    const n = nums.length;
    const parts = [];
    const boxSize = Math.min(64, Math.floor(840 / n) - 8);
    const gap = 10;
    const totalW = n * (boxSize + gap) - gap;
    const startX = (920 - totalW) / 2;
    const boxY = 70;

    function bx(idx) { return startX + idx * (boxSize + gap); }

    const lo = step.lo, hi = step.hi, mid = step.mid;
    const rangeActive = lo !== undefined && hi !== undefined && lo <= hi && step.type !== "final";

    if (rangeActive) {
      const b0 = bx(lo) - gap / 2;
      const b1 = bx(hi) + boxSize + gap / 2;
      parts.push(
        '<rect x="' + b0 + '" y="' + (boxY - 10) + '" width="' + (b1 - b0) + '" height="' + (boxSize + 20) +
        '" rx="12" fill="var(--window-soft)" stroke="var(--mid-color)" stroke-width="1.6" stroke-dasharray="6,4"/>'
      );
      parts.push(
        '<text x="' + ((b0 + b1) / 2) + '" y="' + (boxY - 18) + '" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="var(--mid-color)" text-anchor="middle">查找区间 [' + lo + ', ' + hi + ']</text>'
      );
    }

    for (let idx = 0; idx < n; idx++) {
      const x0 = bx(idx);
      const val = nums[idx];
      const inRange = rangeActive && idx >= lo && idx <= hi;
      const isLo = rangeActive && idx === lo;
      const isHi = rangeActive && idx === hi;
      const isMid = mid !== undefined && idx === mid && step.type !== "phase-init" && step.type !== "phase-done" && step.type !== "final";
      const isRes = step.res !== undefined && step.res >= 0 && idx === step.res;
      const isFinalAnswer = step.type === "final" && (idx === step.first || idx === step.last) && step.first !== -1;

      let fill = inRange ? "var(--box)" : "var(--box-dim)";
      let opacity = inRange ? "1" : "0.42";
      let stroke = "#2c3766", strokeWidth = "1";

      if (isFinalAnswer) { fill = "rgba(255,209,102,0.18)"; stroke = "var(--best)"; strokeWidth = "2.5"; opacity = "1"; }
      else if (isMid && (step.type === "eq")) { fill = "rgba(255,209,102,0.18)"; stroke = "var(--best)"; strokeWidth = "3"; opacity = "1"; }
      else if (isMid && step.type === "less") { fill = "rgba(249,110,110,0.12)"; stroke = "var(--over)"; strokeWidth = "2.5"; opacity = "1"; }
      else if (isMid && step.type === "greater") { fill = "rgba(249,110,110,0.12)"; stroke = "var(--over)"; strokeWidth = "2.5"; opacity = "1"; }
      else if (isMid && step.type === "mid") { stroke = "var(--mid-color)"; strokeWidth = "2.5"; }
      else if (isLo && isHi) { stroke = "var(--mid-color)"; strokeWidth = "2.5"; }
      else if (isLo) { stroke = "var(--lo-color)"; strokeWidth = "2.5"; }
      else if (isHi) { stroke = "var(--hi-color)"; strokeWidth = "2.5"; }
      else if (isRes) { stroke = "var(--best)"; strokeWidth = "2"; }

      parts.push(
        '<rect x="' + x0 + '" y="' + boxY + '" width="' + boxSize + '" height="' + boxSize +
        '" rx="10" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + strokeWidth + '" opacity="' + opacity + '"/>'
      );
      parts.push(
        '<text x="' + (x0 + boxSize / 2) + '" y="' + (boxY + boxSize / 2 + 6) + '" font-family="JetBrains Mono, monospace" font-size="' + Math.min(20, boxSize * 0.4) +
        '" font-weight="700" fill="var(--ink)" text-anchor="middle" opacity="' + opacity + '">' + val + '</text>'
      );
      parts.push(
        '<text x="' + (x0 + boxSize / 2) + '" y="' + (boxY + boxSize + 16) + '" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--ink-dim)" text-anchor="middle">' + idx + '</text>'
      );
    }

    if (rangeActive) {
      const ay = boxY + boxSize + 38;
      const lox = bx(lo) + boxSize / 2;
      const hix = bx(hi) + boxSize / 2;
      parts.push('<text x="' + lox + '" y="' + ay + '" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--lo-color)" text-anchor="middle">▲</text>');
      parts.push('<text x="' + lox + '" y="' + (ay + 14) + '" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--lo-color)" text-anchor="middle">lo</text>');
      if (hi !== lo) {
        parts.push('<text x="' + hix + '" y="' + ay + '" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--hi-color)" text-anchor="middle">▲</text>');
        parts.push('<text x="' + hix + '" y="' + (ay + 14) + '" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--hi-color)" text-anchor="middle">hi</text>');
      }
      if (mid !== undefined && step.type !== "phase-init" && step.type !== "phase-done") {
        const midx = bx(mid) + boxSize / 2;
        parts.push('<text x="' + midx + '" y="' + (ay + 30) + '" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--mid-color)" text-anchor="middle">▲</text>');
        parts.push('<text x="' + midx + '" y="' + (ay + 44) + '" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--mid-color)" text-anchor="middle">mid</text>');
      }
    }

    if (step.type === "final") {
      const label = step.first === -1 ? "返回 [-1, -1]" : "返回 [" + step.first + ", " + step.last + "]";
      parts.push('<rect x="330" y="' + (boxY + 8) + '" width="260" height="34" rx="17" fill="rgba(255,209,102,0.10)" stroke="var(--best)" stroke-width="1.3"/>');
      parts.push('<text x="460" y="' + (boxY + 30) + '" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="var(--best)" text-anchor="middle">' + label + '</text>');
    }

    document.getElementById("stage").innerHTML = parts.join("");
  }

  function render() {
    const step = steps[current];

    renderStage(step);
    highlightLines(step.lines);

    const tag = document.getElementById("phase-tag");
    if (step.type === "final") {
      tag.textContent = "结果";
      tag.className = "phase-tag";
    } else {
      tag.textContent = step.phase === "first" ? "阶段：寻找最左边界" : "阶段：寻找最右边界";
      tag.className = "phase-tag " + (step.phase === "first" ? "first" : "last");
    }

    document.getElementById("chip-lo").textContent = step.lo !== undefined ? step.lo : "—";
    document.getElementById("chip-hi").textContent = step.hi !== undefined ? step.hi : "—";
    document.getElementById("chip-mid").textContent = (step.mid !== undefined && step.type !== "phase-init" && step.type !== "phase-done") ? step.mid : "—";
    document.getElementById("chip-res").textContent = step.res !== undefined ? step.res : "-1";

    let ansText = "—";
    if (step.type === "final") {
      ansText = step.first === -1 ? "[-1, -1]" : "[" + step.first + ", " + step.last + "]";
    }
    document.getElementById("chip-ans").textContent = ansText;

    document.getElementById("desc-box").textContent = step.desc;
    document.getElementById("step-counter").textContent = "步骤 " + current + " / " + (steps.length - 1);

    document.getElementById("btn-prev").disabled = current === 0;
    document.getElementById("btn-next").disabled = current === steps.length - 1;
  }

  function stopPlay() {
    if (playTimer) { clearInterval(playTimer); playTimer = null; document.getElementById("btn-play").textContent = "播放"; }
  }

  function reloadWith(arrStr, targetStr) {
    stopPlay();
    const parsed = arrStr.split(",").map(v => parseInt(v.trim(), 10)).filter(v => !isNaN(v));
    nums = parsed.length ? parsed : [0];
    const parsedTarget = parseInt(targetStr, 10);
    target = isNaN(parsedTarget) ? 0 : parsedTarget;
    steps = simulate(nums, target);
    current = 0;
    render();
  }

  document.getElementById("btn-run").addEventListener("click", () => {
    reloadWith(document.getElementById("input-arr").value, document.getElementById("input-target").value);
  });
  document.getElementById("input-arr").addEventListener("keydown", (e) => {
    if (e.key === "Enter") reloadWith(document.getElementById("input-arr").value, document.getElementById("input-target").value);
  });
  document.getElementById("input-target").addEventListener("keydown", (e) => {
    if (e.key === "Enter") reloadWith(document.getElementById("input-arr").value, document.getElementById("input-target").value);
  });

  document.getElementById("btn-next").addEventListener("click", () => {
    if (current < steps.length - 1) { current++; render(); }
    if (current === steps.length - 1) stopPlay();
  });
  document.getElementById("btn-prev").addEventListener("click", () => {
    stopPlay(); if (current > 0) { current--; render(); }
  });
  document.getElementById("btn-reset").addEventListener("click", () => {
    stopPlay(); current = 0; render();
  });
  document.getElementById("btn-play").addEventListener("click", () => {
    if (playTimer) { stopPlay(); return; }
    document.getElementById("btn-play").textContent = "暂停";
    playTimer = setInterval(() => {
      if (current < steps.length - 1) { current++; render(); } else stopPlay();
    }, 1300);
  });
  document.addEventListener("keydown", (e) => {
    if (document.activeElement && (document.activeElement.id === "input-arr" || document.activeElement.id === "input-target")) return;
    if (e.key === "ArrowRight") document.getElementById("btn-next").click();
    if (e.key === "ArrowLeft") document.getElementById("btn-prev").click();
  });

  render();
})();
</script>
</body>
</html>
