<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三数之和 · 双指针分步演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b132b;
    --panel: #121a3a;
    --panel-border: #26315e;
    --ink: #e8eef4;
    --ink-dim: #93a1c2;
    --box: #1a2350;
    --box-dim: #14193a;
    --i-color: #c86bfa;
    --j-color: #3ddc97;
    --k-color: #f9a826;
    --gt: #f96e6e;
    --lt: #5bc0eb;
    --eq: #6ee7a0;
    --accent: #5bc0eb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: radial-gradient(ellipse at top, #101a3f 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    padding: 28px 20px 60px;
    min-height: 100vh;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  header { margin-bottom: 22px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--accent);
    text-transform: uppercase;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 6px 0 4px;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--ink-dim);
    font-size: 14px;
    line-height: 1.6;
  }

  .grid {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 18px;
    margin-top: 22px;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 18px 18px 20px;
  }
  .panel h2 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 12px;
  }

  .stage-svg { width: 100%; height: auto; display: block; }

  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  button {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    background: #1a2350;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 9px 14px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover:not(:disabled) { background: #232d5e; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #051424; border-color: var(--accent); }
  button.primary:hover:not(:disabled) { background: #8fd8f5; }

  .step-counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-dim);
    margin-left: auto;
    white-space: nowrap;
  }

  .desc-box {
    margin-top: 16px;
    padding: 13px 15px;
    background: #0e1636;
    border: 1px solid var(--panel-border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--ink);
    min-height: 60px;
  }

  .chips {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 14px;
  }
  @media (max-width: 560px) {
    .chips { grid-template-columns: repeat(2, 1fr); }
  }
  .chip {
    background: #0e1636;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px 10px;
    text-align: center;
  }
  .chip .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
  }
  .chip .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    font-weight: 700;
    margin-top: 2px;
  }
  .chip.i .value { color: var(--i-color); }
  .chip.j .value { color: var(--j-color); }
  .chip.k .value { color: var(--k-color); }
  .chip.s .value { color: var(--accent); }
  .chip.ans .value { color: var(--eq); }

  .triples-box {
    margin-top: 14px;
  }
  .triples-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }
  .triples-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 30px;
  }
  .triple-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--eq);
    background: rgba(110, 231, 160, 0.1);
    border: 1px solid rgba(110, 231, 160, 0.35);
    border-radius: 999px;
    padding: 4px 12px;
  }
  .triples-empty {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--ink-dim);
  }

  .code-box {
    background: #0a1130;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.85;
    overflow-x: auto;
  }
  .line {
    display: flex;
    padding: 0 14px;
    white-space: pre;
    border-left: 3px solid transparent;
    color: #a9b4d6;
  }
  .line .ln {
    width: 26px;
    flex: 0 0 26px;
    color: #4a5580;
    user-select: none;
  }
  .line.active {
    background: rgba(91, 192, 235, 0.12);
    border-left: 3px solid var(--accent);
    color: var(--ink);
  }
  .line.active .ln { color: var(--accent); }

  .legend {
    display: flex;
    gap: 18px;
    margin-top: 14px;
    font-size: 12px;
    color: var(--ink-dim);
    flex-wrap: wrap;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Sorting + Two Pointers · O(n²) / O(1)</div>
    <h1>三数之和 —— 排序 + 双指针分步演示</h1>
    <div class="sub">数组元素与源代码同步高亮，展示外层指针 i 固定一个数，内层 j、k 双指针在剩余区间中查找，并跳过重复元素以避免重复三元组的完整过程。</div>
  </header>

  <div class="grid">

    <div class="panel">
      <h2>数组演示</h2>
      <svg class="stage-svg" viewBox="0 0 920 260" id="stage"></svg>

      <div class="legend">
        <span><i class="dot" style="background:var(--i-color)"></i>i 指针（固定数 x）</span>
        <span><i class="dot" style="background:var(--j-color)"></i>j 指针</span>
        <span><i class="dot" style="background:var(--k-color)"></i>k 指针</span>
        <span><i class="dot" style="background:var(--eq)"></i>已找到三元组</span>
      </div>

      <div class="chips">
        <div class="chip i"><div class="label">I</div><div class="value" id="chip-i">-</div></div>
        <div class="chip j"><div class="label">J</div><div class="value" id="chip-j">-</div></div>
        <div class="chip k"><div class="label">K</div><div class="value" id="chip-k">-</div></div>
        <div class="chip s"><div class="label">S</div><div class="value" id="chip-s">-</div></div>
        <div class="chip ans"><div class="label">已找到</div><div class="value" id="chip-ans">0</div></div>
      </div>

      <div class="triples-box">
        <div class="triples-label">ANS 中的三元组</div>
        <div class="triples-list" id="triples-list"><span class="triples-empty">暂无</span></div>
      </div>

      <div class="desc-box" id="desc-box">加载中。</div>

      <div class="controls">
        <button id="btn-reset">重置</button>
        <button id="btn-prev">上一步</button>
        <button id="btn-play" class="primary">播放</button>
        <button id="btn-next">下一步</button>
        <div class="step-counter" id="step-counter">步骤 0 / 0</div>
      </div>
    </div>

    <div class="panel">
      <h2>对应源代码</h2>
      <div class="code-box" id="code-box"></div>
    </div>

  </div>
</div>

<script>
(function () {
  const inputNums = [-1, 0, 1, 2, -1, -4];

  const codeLines = [
    "# 其他语言的实现，见视频简介",
    "class Solution:",
    "    def threeSum(self, nums: List[int]) -> List[List[int]]:",
    "        nums.sort()",
    "        # 三元组的顺序并不重要",
    "        # i < j < k",
    "        # 答案中不可以包含重复的三元组",
    "        ans = []",
    "        n = len(nums)",
    "        for i in range(n - 2):",
    "            x = nums[i]",
    "            if i > 0 and x == nums[i-1]:",
    "                continue",
    "            j = i + 1",
    "            k = n - 1",
    "            while j < k:",
    "                s = x + nums[j] + nums[k]",
    "                if s > 0:",
    "                    k -= 1",
    "                elif s < 0:",
    "                    j += 1",
    "                else:",
    "                    ans.append([x, nums[j], nums[k]])",
    "                    j += 1",
    "                    while j < k and nums[j] == nums[j-1]:",
    "                        j += 1",
    "                    k -= 1",
    "                    while k > j and nums[k] == nums[k+1]:",
    "                        k -= 1",
    "        return ans"
  ];

  function simulate(input) {
    const nums = input.slice().sort((a, b) => a - b);
    const n = nums.length;
    const steps = [];
    let ans = [];

    steps.push({
      type: "sort",
      nums: nums.slice(),
      lines: [4],
      desc: "对 nums 排序（非递减），排序结果为：" + nums.join(", ") + "。排序后可以用双指针从两端向中间收缩查找。",
      foundTriples: []
    });

    for (let i = 0; i < n - 2; i++) {
      const x = nums[i];

      if (i > 0 && x === nums[i - 1]) {
        steps.push({
          type: "i-skip", i, x,
          lines: [10, 11, 12, 13],
          desc: "i=" + i + "，x=nums[i]=" + x + "。i 大于 0 且与上一个数字相同，跳过当前 i，避免出现重复的三元组。",
          foundTriples: ans.map((t) => t.slice())
        });
        continue;
      }

      let j = i + 1, k = n - 1;

      steps.push({
        type: "i-init", i, x, j, k,
        lines: [10, 11, 12, 14, 15],
        desc: "i=" + i + "，x=nums[i]=" + x + "。设置 j=i+1=" + j + "，k=n-1=" + k + "，开始在 [j, k] 区间内查找。",
        foundTriples: ans.map((t) => t.slice())
      });

      while (j < k) {
        const s = x + nums[j] + nums[k];

        if (s > 0) {
          steps.push({
            type: "iter", branch: "k-dec", i, x, j, k, s,
            lines: [16, 17, 18, 19],
            desc: "s = " + x + " + " + nums[j] + " + " + nums[k] + " = " + s + "，大于 0，说明三数之和偏大，k 左移一位以减小和。",
            foundTriples: ans.map((t) => t.slice())
          });
          k -= 1;
        } else if (s < 0) {
          steps.push({
            type: "iter", branch: "j-inc", i, x, j, k, s,
            lines: [16, 17, 19, 20, 21],
            desc: "s = " + x + " + " + nums[j] + " + " + nums[k] + " = " + s + "，小于 0，说明三数之和偏小，j 右移一位以增大和。",
            foundTriples: ans.map((t) => t.slice())
          });
          j += 1;
        } else {
          const triple = [x, nums[j], nums[k]];
          ans.push(triple);

          let jAfter = j + 1, jSkips = 0;
          while (jAfter < k && nums[jAfter] === nums[jAfter - 1]) { jAfter += 1; jSkips += 1; }

          let kAfter = k - 1, kSkips = 0;
          while (kAfter > jAfter && nums[kAfter] === nums[kAfter + 1]) { kAfter -= 1; kSkips += 1; }

          let desc = "s = " + x + " + " + nums[j] + " + " + nums[k] + " = 0，找到三元组 [" + triple.join(", ") + "]，加入 ans。";
          desc += " j 右移一位";
          if (jSkips > 0) desc += "，并跳过 " + jSkips + " 个重复数字";
          desc += "；k 左移一位";
          if (kSkips > 0) desc += "，并跳过 " + kSkips + " 个重复数字";
          desc += "。";

          steps.push({
            type: "iter", branch: "found", i, x, j, k, s, triple,
            lines: [16, 17, 22, 23, 24, 25, 26, 27, 28, 29],
            desc,
            foundTriples: ans.map((t) => t.slice())
          });

          j = jAfter;
          k = kAfter;
        }
      }
    }

    steps.push({
      type: "final",
      lines: [30],
      desc: "外层循环结束，共找到 " + ans.length + " 个不重复的三元组，返回 ans。",
      foundTriples: ans.map((t) => t.slice())
    });

    return steps;
  }

  const steps = simulate(inputNums);
  const sortedNums = steps[0].nums;
  const n = sortedNums.length;
  let current = 0;
  let playTimer = null;

  // ---- code panel ----
  const codeBox = document.getElementById("code-box");
  codeLines.forEach((text, i) => {
    const row = document.createElement("div");
    row.className = "line";
    row.id = "line-" + (i + 1);
    row.innerHTML = '<span class="ln">' + (i + 1) + '</span><span class="code">' + text + "</span>";
    codeBox.appendChild(row);
  });

  function highlightLines(lines) {
    codeLines.forEach((_, i) => {
      document.getElementById("line-" + (i + 1)).classList.remove("active");
    });
    lines.forEach((ln) => {
      const el = document.getElementById("line-" + ln);
      if (el) el.classList.add("active");
    });
  }

  // ---- SVG stage geometry ----
  const boxSize = 58, gap = 16, startX = 60;
  const boxY = 76;

  function boxX(idx) { return startX + idx * (boxSize + gap); }

  function renderStage(step) {
    const parts = [];
    const hasIJK = step.i !== undefined;
    const i = step.i, j = step.j, k = step.k;

    if (step.s !== undefined && j !== undefined && k !== undefined) {
      const x1 = boxX(j) + boxSize / 2;
      const x2 = boxX(k) + boxSize / 2;
      const bracketY = boxY - 24;
      let symColor = "var(--eq)", sym = "=";
      if (step.branch === "k-dec") { symColor = "var(--gt)"; sym = ">"; }
      if (step.branch === "j-inc") { symColor = "var(--lt)"; sym = "<"; }

      parts.push(
        '<path d="M ' + x1 + ' ' + boxY + ' L ' + x1 + ' ' + bracketY + ' L ' + x2 + ' ' + bracketY + ' L ' + x2 + ' ' + boxY +
        '" fill="none" stroke="' + symColor + '" stroke-width="1.5" opacity="0.85"/>'
      );
      parts.push(
        '<text x="' + ((x1 + x2) / 2) + '" y="' + (bracketY - 9) + '" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="' + symColor +
        '" text-anchor="middle">' + step.x + ' + ' + sortedNums[j] + ' + ' + sortedNums[k] + ' = ' + step.s + '  ' + sym + '  0</text>'
      );
    } else if (step.type === "i-init" || step.type === "i-skip") {
      parts.push(
        '<text x="460" y="' + (boxY - 34) + '" font-family="JetBrains Mono, monospace" font-size="12" fill="var(--i-color)" text-anchor="middle">x = nums[i] = ' + step.x + '</text>'
      );
    }

    // boxes
    for (let idx = 0; idx < n; idx++) {
      const x = boxX(idx);
      let inWindow = true;
      if (hasIJK && j !== undefined && k !== undefined) {
        inWindow = idx === i || (idx >= j && idx <= k);
      } else if (hasIJK) {
        inWindow = idx === i;
      }

      let fill = inWindow ? "var(--box)" : "var(--box-dim)";
      let opacity = inWindow ? "1" : "0.35";
      let stroke = "#2c3766";
      let strokeWidth = "1";

      if (idx === i) { stroke = "var(--i-color)"; strokeWidth = "2.5"; }
      else if (idx === j) { stroke = "var(--j-color)"; strokeWidth = "2.5"; }
      else if (idx === k) { stroke = "var(--k-color)"; strokeWidth = "2.5"; }

      parts.push(
        '<rect x="' + x + '" y="' + boxY + '" width="' + boxSize + '" height="' + boxSize +
        '" rx="9" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + strokeWidth + '" opacity="' + opacity + '"/>'
      );
      parts.push(
        '<text x="' + (x + boxSize / 2) + '" y="' + (boxY + boxSize / 2 + 5) + '" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="var(--ink)" text-anchor="middle" opacity="' + opacity + '">' + sortedNums[idx] + '</text>'
      );
      parts.push(
        '<text x="' + (x + boxSize / 2) + '" y="' + (boxY + boxSize + 16) + '" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--ink-dim)" text-anchor="middle">' + idx + '</text>'
      );
    }

    // pointer arrows
    if (hasIJK) {
      const arrowY = boxY + boxSize + 38;
      const ix = boxX(i) + boxSize / 2;
      parts.push(
        '<text x="' + ix + '" y="' + arrowY + '" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--i-color)" text-anchor="middle">▲</text>'
      );
      parts.push(
        '<text x="' + ix + '" y="' + (arrowY + 14) + '" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--i-color)" text-anchor="middle">i</text>'
      );

      if (j !== undefined) {
        const jx = boxX(j) + boxSize / 2;
        parts.push(
          '<text x="' + jx + '" y="' + arrowY + '" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--j-color)" text-anchor="middle">▲</text>'
        );
        parts.push(
          '<text x="' + jx + '" y="' + (arrowY + 14) + '" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--j-color)" text-anchor="middle">j</text>'
        );
      }
      if (k !== undefined) {
        const kx = boxX(k) + boxSize / 2;
        parts.push(
          '<text x="' + kx + '" y="' + arrowY + '" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--k-color)" text-anchor="middle">▲</text>'
        );
        parts.push(
          '<text x="' + kx + '" y="' + (arrowY + 14) + '" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--k-color)" text-anchor="middle">k</text>'
        );
      }
    }

    document.getElementById("stage").innerHTML = parts.join("");
  }

  function renderTriples(list) {
    const container = document.getElementById("triples-list");
    if (!list || list.length === 0) {
      container.innerHTML = '<span class="triples-empty">暂无</span>';
      return;
    }
    container.innerHTML = list
      .map((t) => '<span class="triple-pill">[' + t.join(", ") + ']</span>')
      .join("");
  }

  function render() {
    const step = steps[current];

    renderStage(step);
    highlightLines(step.lines);
    renderTriples(step.foundTriples);

    document.getElementById("chip-i").textContent = step.i !== undefined ? step.i : "—";
    document.getElementById("chip-j").textContent = step.j !== undefined ? step.j : "—";
    document.getElementById("chip-k").textContent = step.k !== undefined ? step.k : "—";
    document.getElementById("chip-s").textContent = step.s !== undefined ? step.s : "—";
    document.getElementById("chip-ans").textContent = step.foundTriples.length;

    document.getElementById("desc-box").textContent = step.desc;
    document.getElementById("step-counter").textContent = "步骤 " + current + " / " + (steps.length - 1);

    document.getElementById("btn-prev").disabled = current === 0;
    document.getElementById("btn-next").disabled = current === steps.length - 1;
  }

  function stopPlay() {
    if (playTimer) {
      clearInterval(playTimer);
      playTimer = null;
      document.getElementById("btn-play").textContent = "播放";
    }
  }

  document.getElementById("btn-next").addEventListener("click", () => {
    if (current < steps.length - 1) { current++; render(); }
    if (current === steps.length - 1) stopPlay();
  });

  document.getElementById("btn-prev").addEventListener("click", () => {
    stopPlay();
    if (current > 0) { current--; render(); }
  });

  document.getElementById("btn-reset").addEventListener("click", () => {
    stopPlay();
    current = 0;
    render();
  });

  document.getElementById("btn-play").addEventListener("click", () => {
    if (playTimer) { stopPlay(); return; }
    document.getElementById("btn-play").textContent = "暂停";
    playTimer = setInterval(() => {
      if (current < steps.length - 1) {
        current++;
        render();
      } else {
        stopPlay();
      }
    }, 1600);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") document.getElementById("btn-next").click();
    if (e.key === "ArrowLeft") document.getElementById("btn-prev").click();
  });

  render();
})();
</script>
</body>
</html>
