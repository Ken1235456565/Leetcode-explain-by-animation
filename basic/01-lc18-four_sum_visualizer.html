<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四数之和 · 双层循环 + 双指针分步演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b132b;
    --panel: #121a3a;
    --panel-border: #26315e;
    --ink: #e8eef4;
    --ink-dim: #93a1c2;
    --box: #1a2350;
    --box-dim: #14193a;
    --a-color: #c86bfa;
    --b-color: #5bc0eb;
    --c-color: #3ddc97;
    --d-color: #f9a826;
    --gt: #f96e6e;
    --lt: #5bc0eb;
    --eq: #6ee7a0;
    --prune: #ffd166;
    --accent: #5bc0eb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: radial-gradient(ellipse at top, #101a3f 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    padding: 28px 20px 60px;
    min-height: 100vh;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  header { margin-bottom: 22px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--accent);
    text-transform: uppercase;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 6px 0 4px;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--ink-dim);
    font-size: 14px;
    line-height: 1.6;
  }

  .grid {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 18px;
    margin-top: 22px;
  }
  @media (max-width: 940px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 18px 18px 20px;
  }
  .panel h2 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 12px;
  }

  .stage-svg { width: 100%; height: auto; display: block; }

  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  button {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    background: #1a2350;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 9px 14px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover:not(:disabled) { background: #232d5e; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #051424; border-color: var(--accent); }
  button.primary:hover:not(:disabled) { background: #8fd8f5; }

  .step-counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-dim);
    margin-left: auto;
    white-space: nowrap;
  }

  .desc-box {
    margin-top: 16px;
    padding: 13px 15px;
    background: #0e1636;
    border: 1px solid var(--panel-border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--ink);
    min-height: 60px;
  }

  .chips {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-top: 14px;
  }
  @media (max-width: 640px) {
    .chips { grid-template-columns: repeat(3, 1fr); }
  }
  .chip {
    background: #0e1636;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px 6px;
    text-align: center;
  }
  .chip .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
  }
  .chip .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    margin-top: 2px;
  }
  .chip.a .value { color: var(--a-color); }
  .chip.b .value { color: var(--b-color); }
  .chip.c .value { color: var(--c-color); }
  .chip.d .value { color: var(--d-color); }
  .chip.s .value { color: var(--accent); }
  .chip.cnt .value { color: var(--eq); }

  .quads-box { margin-top: 14px; }
  .quads-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }
  .quads-list { display: flex; flex-wrap: wrap; gap: 8px; min-height: 28px; }
  .quad-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--eq);
    background: rgba(110, 231, 160, 0.1);
    border: 1px solid rgba(110, 231, 160, 0.35);
    border-radius: 999px;
    padding: 4px 12px;
  }
  .quads-empty { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--ink-dim); }

  .code-box {
    background: #0a1130;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    line-height: 1.72;
    overflow-x: auto;
  }
  .line {
    display: flex;
    padding: 0 12px;
    white-space: pre;
    border-left: 3px solid transparent;
    color: #a9b4d6;
  }
  .line .ln {
    width: 24px;
    flex: 0 0 24px;
    color: #4a5580;
    user-select: none;
  }
  .line.active {
    background: rgba(91, 192, 235, 0.12);
    border-left: 3px solid var(--accent);
    color: var(--ink);
  }
  .line.active .ln { color: var(--accent); }

  .legend {
    display: flex;
    gap: 16px;
    margin-top: 14px;
    font-size: 12px;
    color: var(--ink-dim);
    flex-wrap: wrap;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Sorting + Two Loops + Two Pointers · O(n³) / O(1)</div>
    <h1>四数之和 —— 双层循环 + 双指针分步演示</h1>
    <div class="sub">排序后用外层 a、b 固定前两个数，内层 c、d 双指针查找剩余两数；同时展示跳过重复元素与提前 break / continue 的剪枝过程。</div>
  </header>

  <div class="grid">

    <div class="panel">
      <h2>数组演示</h2>
      <svg class="stage-svg" viewBox="0 0 920 280" id="stage"></svg>

      <div class="legend">
        <span><i class="dot" style="background:var(--a-color)"></i>a</span>
        <span><i class="dot" style="background:var(--b-color)"></i>b</span>
        <span><i class="dot" style="background:var(--c-color)"></i>c</span>
        <span><i class="dot" style="background:var(--d-color)"></i>d</span>
        <span><i class="dot" style="background:var(--prune)"></i>跳过 / 剪枝</span>
      </div>

      <div class="chips">
        <div class="chip a"><div class="label">A</div><div class="value" id="chip-a">-</div></div>
        <div class="chip b"><div class="label">B</div><div class="value" id="chip-b">-</div></div>
        <div class="chip c"><div class="label">C</div><div class="value" id="chip-c">-</div></div>
        <div class="chip d"><div class="label">D</div><div class="value" id="chip-d">-</div></div>
        <div class="chip s"><div class="label">S</div><div class="value" id="chip-s">-</div></div>
        <div class="chip cnt"><div class="label">已找到</div><div class="value" id="chip-cnt">0</div></div>
      </div>

      <div class="quads-box">
        <div class="quads-label">ANS 中的四元组</div>
        <div class="quads-list" id="quads-list"><span class="quads-empty">暂无</span></div>
      </div>

      <div class="desc-box" id="desc-box">加载中。</div>

      <div class="controls">
        <button id="btn-reset">重置</button>
        <button id="btn-prev">上一步</button>
        <button id="btn-play" class="primary">播放</button>
        <button id="btn-next">下一步</button>
        <div class="step-counter" id="step-counter">步骤 0 / 0</div>
      </div>
    </div>

    <div class="panel">
      <h2>对应源代码</h2>
      <div class="code-box" id="code-box"></div>
    </div>

  </div>
</div>

<script>
(function () {
  const inputNums = [1, 0, -1, 0, -2, 2];
  const target = 0;

  const codeLines = [
    "def fourSum(self, nums, target):",
    "    nums.sort()",
    "    n = len(nums)",
    "    ans = []",
    "    for a in range(n - 3):            # 枚举第一个数",
    "        x = nums[a]",
    "        if a > 0 and x == nums[a-1]: continue",
    "        if x+nums[a+1]+nums[a+2]+nums[a+3] > target: break",
    "        if x+nums[n-3]+nums[n-2]+nums[n-1] < target: continue",
    "        for b in range(a + 1, n - 2): # 枚举第二个数",
    "            y = nums[b]",
    "            if b > a+1 and y == nums[b-1]: continue",
    "            if x+y+nums[b+1]+nums[b+2] > target: break",
    "            if x+y+nums[n-2]+nums[n-1] < target: continue",
    "            c = b + 1",
    "            d = n - 1",
    "            while c < d:              # 双指针",
    "                s = x + y + nums[c] + nums[d]",
    "                if s > target: d -= 1",
    "                elif s < target: c += 1",
    "                else:",
    "                    ans.append([x, y, nums[c], nums[d]])",
    "                    c += 1",
    "                    while c < d and nums[c] == nums[c-1]: c += 1",
    "                    d -= 1",
    "                    while d > c and nums[d] == nums[d+1]: d -= 1",
    "    return ans"
  ];

  function simulate(input, target) {
    const nums = input.slice().sort((p, q) => p - q);
    const n = nums.length;
    const steps = [];
    const ans = [];

    steps.push({
      type: "init", nums: nums.slice(),
      lines: [2, 3, 4],
      desc: "排序后 nums 为 [" + nums.join(", ") + "]。ans 初始化为空，准备用双层循环加双指针查找。",
      quads: []
    });

    for (let a = 0; a < n - 3; a++) {
      const x = nums[a];

      if (a > 0 && x === nums[a - 1]) {
        steps.push({ type: "prune", a, lines: [6, 7], prune: true,
          desc: "a=" + a + "，nums[a]=" + x + " 与上一个相同，跳过以避免重复四元组。",
          quads: ans.map(q => q.slice()) });
        continue;
      }
      if (x + nums[a + 1] + nums[a + 2] + nums[a + 3] > target) {
        steps.push({ type: "prune", a, lines: [6, 8], prune: true,
          desc: "a=" + a + "：以 nums[a] 起最小的四个数之和 " +
                (x + nums[a + 1] + nums[a + 2] + nums[a + 3]) + " 已大于 target(" + target +
                ")，后面只会更大，break 结束整个外层循环。",
          quads: ans.map(q => q.slice()) });
        break;
      }
      if (x + nums[n - 3] + nums[n - 2] + nums[n - 1] < target) {
        steps.push({ type: "prune", a, lines: [6, 9], prune: true,
          desc: "a=" + a + "：以 nums[a] 配最大的三个数之和仍小于 target，当前 a 无解，continue 跳到下一个 a。",
          quads: ans.map(q => q.slice()) });
        continue;
      }

      steps.push({ type: "a-set", a, x, lines: [5, 6],
        desc: "固定第一个数 a=" + a + "（nums[a]=" + x + "），进入内层循环枚举第二个数 b。",
        quads: ans.map(q => q.slice()) });

      for (let b = a + 1; b < n - 2; b++) {
        const y = nums[b];

        if (b > a + 1 && y === nums[b - 1]) {
          steps.push({ type: "prune", a, b, lines: [11, 12], prune: true,
            desc: "b=" + b + "，nums[b]=" + y + " 与上一个相同，跳过以避免重复。",
            quads: ans.map(q => q.slice()) });
          continue;
        }
        if (x + y + nums[b + 1] + nums[b + 2] > target) {
          steps.push({ type: "prune", a, b, lines: [11, 13], prune: true,
            desc: "b=" + b + "：x+y 加最小两个数已超过 target，后面更大，break 退出内层循环。",
            quads: ans.map(q => q.slice()) });
          break;
        }
        if (x + y + nums[n - 2] + nums[n - 1] < target) {
          steps.push({ type: "prune", a, b, lines: [11, 14], prune: true,
            desc: "b=" + b + "：x+y 加最大两个数仍小于 target，当前 b 无解，continue。",
            quads: ans.map(q => q.slice()) });
          continue;
        }

        let c = b + 1, d = n - 1;
        steps.push({ type: "b-set", a, b, x, y, c, d, lines: [10, 11, 15, 16, 17],
          desc: "固定第二个数 b=" + b + "（nums[b]=" + y + "），设置 c=b+1=" + c + "，d=n-1=" + d + "，开始双指针。",
          quads: ans.map(q => q.slice()) });

        while (c < d) {
          const s = x + y + nums[c] + nums[d];

          if (s > target) {
            steps.push({ type: "iter", branch: "gt", a, b, c, d, s, x, y, lines: [17, 18, 19],
              desc: "s = " + x + "+" + y + "+" + nums[c] + "+" + nums[d] + " = " + s +
                    " > target(" + target + ")，d 左移一位。",
              quads: ans.map(q => q.slice()) });
            d -= 1;
          } else if (s < target) {
            steps.push({ type: "iter", branch: "lt", a, b, c, d, s, x, y, lines: [17, 18, 20],
              desc: "s = " + x + "+" + y + "+" + nums[c] + "+" + nums[d] + " = " + s +
                    " < target(" + target + ")，c 右移一位。",
              quads: ans.map(q => q.slice()) });
            c += 1;
          } else {
            const quad = [x, y, nums[c], nums[d]];
            ans.push(quad);

            let cAfter = c + 1, cSkip = 0;
            while (cAfter < d && nums[cAfter] === nums[cAfter - 1]) { cAfter++; cSkip++; }
            let dAfter = d - 1, dSkip = 0;
            while (dAfter > cAfter && nums[dAfter] === nums[dAfter + 1]) { dAfter--; dSkip++; }

            let desc = "s = " + x + "+" + y + "+" + nums[c] + "+" + nums[d] + " = target，找到四元组 [" +
                       quad.join(", ") + "]，加入 ans。c 右移";
            if (cSkip > 0) desc += " 并跳过 " + cSkip + " 个重复";
            desc += "，d 左移";
            if (dSkip > 0) desc += " 并跳过 " + dSkip + " 个重复";
            desc += "。";

            steps.push({ type: "iter", branch: "found", a, b, c, d, s, x, y, quad,
              lines: [17, 20, 21, 22, 23, 24, 25],
              desc, quads: ans.map(q => q.slice()) });

            c = cAfter; d = dAfter;
          }
        }
      }
    }

    steps.push({ type: "final", lines: [26],
      desc: "全部枚举与剪枝完成，共找到 " + ans.length + " 个不重复的四元组，返回 ans。",
      quads: ans.map(q => q.slice()) });

    return steps;
  }

  const steps = simulate(inputNums, target);
  const sortedNums = steps[0].nums;
  const n = sortedNums.length;
  let current = 0;
  let playTimer = null;

  // ---- code panel ----
  const codeBox = document.getElementById("code-box");
  codeLines.forEach((text, i) => {
    const row = document.createElement("div");
    row.className = "line";
    row.id = "line-" + (i + 1);
    row.innerHTML = '<span class="ln">' + (i + 1) + '</span><span class="code">' + text.replace(/</g, "&lt;") + "</span>";
    codeBox.appendChild(row);
  });

  function highlightLines(lines) {
    codeLines.forEach((_, i) => {
      document.getElementById("line-" + (i + 1)).classList.remove("active");
    });
    lines.forEach((ln) => {
      const el = document.getElementById("line-" + ln);
      if (el) el.classList.add("active");
    });
  }

  // ---- SVG stage geometry ----
  const boxSize = 62, gap = 20, startX = 100;
  const boxY = 92;

  function boxX(idx) { return startX + idx * (boxSize + gap); }

  function renderStage(step) {
    const parts = [];
    const a = step.a, b = step.b, c = step.c, d = step.d;
    const hasCD = c !== undefined && d !== undefined;

    // sum bracket connecting c and d
    if (step.s !== undefined && hasCD) {
      const xc = boxX(c) + boxSize / 2;
      const xd = boxX(d) + boxSize / 2;
      const bracketY = boxY - 30;
      let symColor = "var(--eq)", sym = "=";
      if (step.branch === "gt") { symColor = "var(--gt)"; sym = ">"; }
      if (step.branch === "lt") { symColor = "var(--lt)"; sym = "<"; }
      parts.push(
        '<path d="M ' + xc + ' ' + boxY + ' L ' + xc + ' ' + bracketY + ' L ' + xd + ' ' + bracketY + ' L ' + xd + ' ' + boxY +
        '" fill="none" stroke="' + symColor + '" stroke-width="1.5" opacity="0.7"/>'
      );
      parts.push(
        '<text x="' + ((xc + xd) / 2) + '" y="' + (bracketY - 9) + '" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="' + symColor +
        '" text-anchor="middle">' + step.x + '+' + step.y + '+' + sortedNums[c] + '+' + sortedNums[d] + ' = ' + step.s + '  ' + sym + '  ' + target + '</text>'
      );
    } else if (step.type === "init") {
      parts.push(
        '<text x="460" y="' + (boxY - 34) + '" font-family="JetBrains Mono, monospace" font-size="13" fill="var(--ink-dim)" text-anchor="middle">target = ' + target + '</text>'
      );
    }

    // boxes
    for (let idx = 0; idx < n; idx++) {
      const x = boxX(idx);
      let inWindow = true;
      if (hasCD) {
        inWindow = idx === a || idx === b || (idx >= c && idx <= d);
      } else if (a !== undefined && b !== undefined) {
        inWindow = idx === a || idx >= b;
      } else if (a !== undefined) {
        inWindow = idx >= a;
      }

      let fill = inWindow ? "var(--box)" : "var(--box-dim)";
      let opacity = inWindow ? "1" : "0.32";
      let stroke = "#2c3766";
      let strokeWidth = "1";
      if (idx === a) { stroke = "var(--a-color)"; strokeWidth = "2.5"; }
      else if (idx === b) { stroke = "var(--b-color)"; strokeWidth = "2.5"; }
      else if (idx === c) { stroke = "var(--c-color)"; strokeWidth = "2.5"; }
      else if (idx === d) { stroke = "var(--d-color)"; strokeWidth = "2.5"; }

      // prune highlight on the offending pointer box
      if (step.prune) {
        const target2 = (step.b !== undefined) ? step.b : step.a;
        if (idx === target2) { stroke = "var(--prune)"; strokeWidth = "3"; }
      }

      parts.push(
        '<rect x="' + x + '" y="' + boxY + '" width="' + boxSize + '" height="' + boxSize +
        '" rx="9" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + strokeWidth + '" opacity="' + opacity + '"/>'
      );
      parts.push(
        '<text x="' + (x + boxSize / 2) + '" y="' + (boxY + boxSize / 2 + 5) + '" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700" fill="var(--ink)" text-anchor="middle" opacity="' + opacity + '">' + sortedNums[idx] + '</text>'
      );
      parts.push(
        '<text x="' + (x + boxSize / 2) + '" y="' + (boxY + boxSize + 16) + '" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--ink-dim)" text-anchor="middle">' + idx + '</text>'
      );
    }

    // pointer arrows (below)
    const arrowY = boxY + boxSize + 38;
    const pts = [
      { idx: a, color: "var(--a-color)", label: "a" },
      { idx: b, color: "var(--b-color)", label: "b" },
      { idx: c, color: "var(--c-color)", label: "c" },
      { idx: d, color: "var(--d-color)", label: "d" }
    ];
    // group labels by column to avoid overlap
    const byCol = {};
    pts.forEach((p) => {
      if (p.idx === undefined) return;
      if (!byCol[p.idx]) byCol[p.idx] = [];
      byCol[p.idx].push(p);
    });
    Object.keys(byCol).forEach((idx) => {
      const group = byCol[idx];
      const px = boxX(parseInt(idx)) + boxSize / 2;
      const labels = group.map(g => g.label).join(",");
      const color = group[0].color;
      parts.push(
        '<text x="' + px + '" y="' + arrowY + '" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="' + color + '" text-anchor="middle">▲</text>'
      );
      parts.push(
        '<text x="' + px + '" y="' + (arrowY + 14) + '" font-family="JetBrains Mono, monospace" font-size="10.5" fill="' + color + '" text-anchor="middle">' + labels + '</text>'
      );
    });

    // prune / found badge
    if (step.prune) {
      parts.push('<rect x="335" y="238" width="250" height="28" rx="14" fill="rgba(255,209,102,0.14)" stroke="var(--prune)" stroke-width="1.1"/>');
      parts.push('<text x="460" y="257" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="var(--prune)" text-anchor="middle">跳过 / 剪枝</text>');
    } else if (step.branch === "found") {
      parts.push('<rect x="315" y="238" width="290" height="28" rx="14" fill="rgba(110,231,160,0.12)" stroke="var(--eq)" stroke-width="1.1"/>');
      parts.push('<text x="460" y="257" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="var(--eq)" text-anchor="middle">找到四元组 [' + step.quad.join(", ") + ']</text>');
    }

    document.getElementById("stage").innerHTML = parts.join("");
  }

  function renderQuads(list) {
    const container = document.getElementById("quads-list");
    if (!list || list.length === 0) {
      container.innerHTML = '<span class="quads-empty">暂无</span>';
      return;
    }
    container.innerHTML = list.map((t) => '<span class="quad-pill">[' + t.join(", ") + ']</span>').join("");
  }

  function render() {
    const step = steps[current];

    renderStage(step);
    highlightLines(step.lines);
    renderQuads(step.quads);

    document.getElementById("chip-a").textContent = step.a !== undefined ? step.a : "—";
    document.getElementById("chip-b").textContent = step.b !== undefined ? step.b : "—";
    document.getElementById("chip-c").textContent = step.c !== undefined ? step.c : "—";
    document.getElementById("chip-d").textContent = step.d !== undefined ? step.d : "—";
    document.getElementById("chip-s").textContent = step.s !== undefined ? step.s : "—";
    document.getElementById("chip-cnt").textContent = step.quads.length;

    document.getElementById("desc-box").textContent = step.desc;
    document.getElementById("step-counter").textContent = "步骤 " + current + " / " + (steps.length - 1);

    document.getElementById("btn-prev").disabled = current === 0;
    document.getElementById("btn-next").disabled = current === steps.length - 1;
  }

  function stopPlay() {
    if (playTimer) {
      clearInterval(playTimer);
      playTimer = null;
      document.getElementById("btn-play").textContent = "播放";
    }
  }

  document.getElementById("btn-next").addEventListener("click", () => {
    if (current < steps.length - 1) { current++; render(); }
    if (current === steps.length - 1) stopPlay();
  });
  document.getElementById("btn-prev").addEventListener("click", () => {
    stopPlay();
    if (current > 0) { current--; render(); }
  });
  document.getElementById("btn-reset").addEventListener("click", () => {
    stopPlay();
    current = 0; render();
  });
  document.getElementById("btn-play").addEventListener("click", () => {
    if (playTimer) { stopPlay(); return; }
    document.getElementById("btn-play").textContent = "暂停";
    playTimer = setInterval(() => {
      if (current < steps.length - 1) { current++; render(); }
      else stopPlay();
    }, 1600);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") document.getElementById("btn-next").click();
    if (e.key === "ArrowLeft") document.getElementById("btn-prev").click();
  });

  render();
})();
</script>
</body>
</html>
