<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>统计最大元素至少出现 K 次的子数组 · 滑动窗口分步演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b132b;
    --panel: #121a3a;
    --panel-border: #26315e;
    --ink: #e8eef4;
    --ink-dim: #93a1c2;
    --box: #1a2350;
    --box-dim: #14193a;
    --maxcol: #c86bfa;
    --left-color: #f9a826;
    --right-color: #3ddc97;
    --window: #5bc0eb;
    --window-soft: rgba(91,192,235,0.15);
    --valid: #6ee7a0;
    --valid-soft: rgba(110,231,160,0.16);
    --over: #f96e6e;
    --accent: #5bc0eb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: radial-gradient(ellipse at top, #101a3f 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    padding: 28px 20px 60px;
    min-height: 100vh;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  header { margin-bottom: 22px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing: 0.14em;
    color: var(--accent); text-transform: uppercase;
  }
  h1 { font-size: 24px; font-weight: 700; margin: 6px 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-dim); font-size: 14px; line-height: 1.6; }

  .grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 18px; margin-top: 22px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 18px 18px 20px;
  }
  .panel h2 {
    font-size: 13px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink-dim); margin: 0 0 12px;
  }

  .stage-svg { width: 100%; height: auto; display: block; }

  .input-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  input[type=text] {
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    color: var(--ink); background: #0e1636; border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 9px 12px; flex: 1; min-width: 150px;
  }
  input[type=number] {
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    color: var(--ink); background: #0e1636; border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 9px 12px; width: 70px;
  }
  .k-label { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--ink-dim); }
  .controls { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button {
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    color: var(--ink); background: #1a2350; border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 9px 14px; cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover:not(:disabled) { background: #232d5e; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #051424; border-color: var(--accent); }
  button.primary:hover:not(:disabled) { background: #8fd8f5; }

  .step-counter {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--ink-dim); margin-left: auto; white-space: nowrap;
  }

  .desc-box {
    margin-top: 16px; padding: 13px 15px; background: #0e1636;
    border: 1px solid var(--panel-border); border-left: 3px solid var(--accent);
    border-radius: 8px; font-size: 13.5px; line-height: 1.7; color: var(--ink);
    min-height: 78px;
  }

  .chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 14px; }
  @media (max-width: 560px) { .chips { grid-template-columns: repeat(3, 1fr); } }
  .chip {
    background: #0e1636; border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 8px 6px; text-align: center;
  }
  .chip .label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-dim); letter-spacing: 0.04em; }
  .chip .value { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; margin-top: 2px; }
  .chip.left .value { color: var(--left-color); }
  .chip.right .value { color: var(--right-color); }
  .chip.cnt .value { color: var(--maxcol); }
  .chip.add .value { color: var(--valid); }
  .chip.ans .value { color: var(--valid); }

  .code-box {
    background: #0a1130; border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 10px 0;
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    line-height: 1.85; overflow-x: auto;
  }
  .line { display: flex; padding: 0 14px; white-space: pre; border-left: 3px solid transparent; color: #a9b4d6; }
  .line .ln { width: 26px; flex: 0 0 26px; color: #4a5580; user-select: none; }
  .line.active { background: rgba(91, 192, 235, 0.12); border-left: 3px solid var(--accent); color: var(--ink); }
  .line.active .ln { color: var(--accent); }

  .legend { display: flex; gap: 16px; margin-top: 14px; font-size: 12px; color: var(--ink-dim); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Sliding Window · O(n) / O(1)</div>
    <h1>统计最大元素至少出现 K 次的子数组 —— 滑动窗口分步演示</h1>
    <div class="sub">mx 是整个数组的最大值。对每个 right，收缩窗口直到窗口内 mx 的个数少于 k；此时以 right 结尾的合法子数组，起点可取 0 到 left-1，共 left 个，累加到答案。</div>
  </header>

  <div class="grid">

    <div class="panel">
      <h2>数组演示</h2>

      <div class="input-row">
        <input type="text" id="input-nums" value="1,3,2,3,3" />
        <span class="k-label">k =</span>
        <input type="number" id="input-k" value="2" min="1" max="9" />
        <button id="btn-run" class="primary">运行</button>
      </div>

      <svg class="stage-svg" viewBox="0 0 920 230" id="stage"></svg>

      <div class="legend">
        <span><i class="dot" style="background:var(--maxcol)"></i>最大值 mx</span>
        <span><i class="dot" style="background:var(--valid)"></i>合法起点区间 [0, left-1]</span>
        <span><i class="dot" style="background:var(--left-color)"></i>left</span>
        <span><i class="dot" style="background:var(--right-color)"></i>right</span>
      </div>

      <div class="chips">
        <div class="chip left"><div class="label">LEFT</div><div class="value" id="chip-left">-</div></div>
        <div class="chip right"><div class="label">RIGHT</div><div class="value" id="chip-right">-</div></div>
        <div class="chip cnt"><div class="label">窗口内 mx 数</div><div class="value" id="chip-cnt">0</div></div>
        <div class="chip add"><div class="label">本步 + left</div><div class="value" id="chip-add">-</div></div>
        <div class="chip ans"><div class="label">ANS（总数）</div><div class="value" id="chip-ans">0</div></div>
      </div>

      <div class="desc-box" id="desc-box">加载中。</div>

      <div class="controls">
        <button id="btn-reset">重置</button>
        <button id="btn-prev">上一步</button>
        <button id="btn-play" class="primary">播放</button>
        <button id="btn-next">下一步</button>
        <div class="step-counter" id="step-counter">步骤 0 / 0</div>
      </div>
    </div>

    <div class="panel">
      <h2>对应源代码</h2>
      <div class="code-box" id="code-box"></div>
    </div>

  </div>
</div>

<script>
(function () {
  const codeLines = [
    "class Solution:",
    "    def countSubarrays(self, nums: List[int], k: int) -> int:",
    "        mx = max(nums)          # 整个数组的最大值",
    "        ans = 0",
    "        cnt = 0                 # 窗口内 mx 的个数",
    "        left = 0",
    "        for right in range(len(nums)):",
    "            if nums[right] == mx:",
    "                cnt += 1",
    "            while cnt >= k:     # 收缩到 mx 少于 k 个",
    "                if nums[left] == mx:",
    "                    cnt -= 1",
    "                left += 1",
    "            ans += left         # 起点 0..left-1 都合法",
    "        return ans"
  ];

  function simulate(nums, k) {
    const n = nums.length;
    const mx = Math.max(...nums);
    const steps = [];
    let ans = 0, cnt = 0, left = 0;

    steps.push({
      type: "init", left: 0, right: -1, cnt: 0, ans: 0, mx,
      lines: [3, 4, 5, 6],
      desc: "nums = [" + nums.join(", ") + "]，k = " + k + "。整个数组的最大值 mx = " + mx +
            "。ans=0，窗口内 mx 计数 cnt=0，left=0。"
    });

    for (let right = 0; right < n; right++) {
      if (nums[right] === mx) cnt += 1;

      steps.push({
        type: "expand", left, right, cnt, mx, isMax: nums[right] === mx,
        lines: nums[right] === mx ? [7, 8, 9] : [7, 8],
        desc: "right 扩到 " + right + "，nums[" + right + "]=" + nums[right] +
              (nums[right] === mx ? " 等于 mx，窗口内 mx 计数增到 " + cnt + (cnt >= k ? "，已达到 k=" + k + "，进入收缩。" : "。") :
                                     " 不是 mx，cnt 保持 " + cnt + "。")
      });

      while (cnt >= k) {
        const removed = nums[left];
        if (removed === mx) cnt -= 1;
        left += 1;
        steps.push({
          type: "shrink", left, right, cnt, removed, mx,
          lines: removed === mx ? [9, 10, 11, 12] : [9, 12],
          desc: "窗口内 mx 数 ≥ k，移出左端 nums[" + (left - 1) + "]=" + removed +
                (removed === mx ? "，它是 mx，cnt 减到 " + cnt + "。" : "，它不是 mx，cnt 不变。") +
                " left 右移到 " + left + "。"
        });
      }

      const add = left;
      ans += add;

      steps.push({
        type: "count", left, right, cnt, add, ans, mx,
        lines: [7, 13],
        desc: "收缩后窗口 [" + left + ", " + right + "] 内 mx 少于 k。对以 right=" + right +
              " 结尾的子数组，起点取 0 到 " + (left - 1) + " 都能让 mx 出现至少 k 次，共 " + add +
              " 个，累加到 ans，ans = " + ans + "。"
      });
    }

    steps.push({
      type: "final", ans, left, right: n - 1, cnt, mx,
      lines: [14],
      desc: "遍历结束，最大元素至少出现 k 次的子数组共有 " + ans + " 个。"
    });

    return steps;
  }

  // ---- code panel (static) ----
  const codeBox = document.getElementById("code-box");
  codeLines.forEach((text, i) => {
    const row = document.createElement("div");
    row.className = "line";
    row.id = "line-" + (i + 1);
    row.innerHTML = '<span class="ln">' + (i + 1) + '</span><span class="code">' + text.replace(/</g, "&lt;") + "</span>";
    codeBox.appendChild(row);
  });

  function highlightLines(lines) {
    codeLines.forEach((_, i) => {
      document.getElementById("line-" + (i + 1)).classList.remove("active");
    });
    lines.forEach((ln) => {
      const el = document.getElementById("line-" + ln);
      if (el) el.classList.add("active");
    });
  }

  // ---- dynamic state ----
  let nums = [1, 3, 2, 3, 3];
  let k = 2;
  let steps = simulate(nums, k);
  let mx = Math.max(...nums);
  let current = 0;
  let playTimer = null;

  function renderStage(step) {
    const n = nums.length;
    const parts = [];
    const boxSize = Math.min(70, Math.floor(840 / n) - 10);
    const gap = 14;
    const totalW = n * (boxSize + gap) - gap;
    const startX = (920 - totalW) / 2;
    const boxY = 80;

    function bx(idx) { return startX + idx * (boxSize + gap); }

    const left = step.left, right = step.right;
    const windowActive = right >= 0 && step.type !== "final";
    const isCount = step.type === "count";
    const isShrink = step.type === "shrink";

    // valid-start band [0, left-1] on count step
    if (isCount && step.add > 0) {
      const b0 = bx(0) - gap / 2;
      const b1 = bx(left - 1) + boxSize + gap / 2;
      parts.push(
        '<rect x="' + b0 + '" y="' + (boxY + boxSize + 26) + '" width="' + (b1 - b0) + '" height="20" rx="8" fill="var(--valid-soft)" stroke="var(--valid)" stroke-width="1.3"/>'
      );
      parts.push(
        '<text x="' + ((b0 + b1) / 2) + '" y="' + (boxY + boxSize + 40) + '" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="var(--valid)" text-anchor="middle">合法起点 0..' + (left - 1) + '（+' + step.add + '）</text>'
      );
    }

    // window band (only when window non-empty and left<=right)
    if (windowActive && left <= right) {
      const b0 = bx(left) - gap / 2;
      const b1 = bx(right) + boxSize + gap / 2;
      let bandStroke = "var(--window)", bandColor = "var(--window-soft)";
      if (step.cnt >= k || isShrink) { bandStroke = "var(--over)"; bandColor = "rgba(249,110,110,0.12)"; }
      parts.push(
        '<rect x="' + b0 + '" y="' + (boxY - 10) + '" width="' + (b1 - b0) + '" height="' + (boxSize + 20) +
        '" rx="12" fill="' + bandColor + '" stroke="' + bandStroke + '" stroke-width="1.5" stroke-dasharray="6,4"/>'
      );
      parts.push(
        '<text x="' + ((b0 + b1) / 2) + '" y="' + (boxY - 18) + '" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="' + bandStroke +
        '" text-anchor="middle">窗口 [' + left + ', ' + right + ']，mx 数 = ' + step.cnt + '</text>'
      );
    } else if (step.type === "init") {
      parts.push('<text x="460" y="' + (boxY - 18) + '" font-family="JetBrains Mono, monospace" font-size="12" fill="var(--maxcol)" text-anchor="middle">mx = ' + mx + '，k = ' + k + '</text>');
    }

    // boxes
    for (let idx = 0; idx < n; idx++) {
      const x = bx(idx);
      const val = nums[idx];
      const isMaxVal = val === mx;
      const inWindow = windowActive && left <= right && idx >= left && idx <= right;
      const isLeft = windowActive && idx === left && left <= right;
      const isRight = windowActive && idx === right;
      const isRemoving = isShrink && idx === left - 1;
      const isValidStart = isCount && step.add > 0 && idx <= left - 1;

      let fill = "var(--box-dim)", opacity = "0.42", textColor = "var(--ink)";
      if (isMaxVal) { fill = inWindow ? "var(--maxcol)" : "rgba(200,107,250,0.28)"; textColor = inWindow ? "#2a0a45" : "var(--ink)"; opacity = inWindow ? "1" : "0.6"; }
      else if (inWindow) { fill = "var(--box)"; opacity = "1"; }

      let stroke = "#2c3766", strokeWidth = "1";
      if (isRemoving) { stroke = "var(--over)"; strokeWidth = "3"; opacity = "0.55"; }
      else if (isLeft && isRight) { stroke = "var(--window)"; strokeWidth = "2.5"; }
      else if (isLeft) { stroke = "var(--left-color)"; strokeWidth = "2.5"; }
      else if (isRight) { stroke = "var(--right-color)"; strokeWidth = "2.5"; }
      else if (isValidStart) { stroke = "var(--valid)"; strokeWidth = "2"; }

      parts.push(
        '<rect x="' + x + '" y="' + boxY + '" width="' + boxSize + '" height="' + boxSize +
        '" rx="10" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + strokeWidth + '" opacity="' + opacity + '"/>'
      );
      parts.push(
        '<text x="' + (x + boxSize / 2) + '" y="' + (boxY + boxSize / 2 + 6) + '" font-family="JetBrains Mono, monospace" font-size="' + Math.min(22, boxSize * 0.42) +
        '" font-weight="700" fill="' + textColor + '" text-anchor="middle" opacity="' + opacity + '">' + val + '</text>'
      );
      parts.push(
        '<text x="' + (x + boxSize / 2) + '" y="' + (boxY - 26) + '" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--ink-dim)" text-anchor="middle">' + idx + '</text>'
      );
    }

    // pointer arrows (above)
    if (windowActive) {
      const ay = boxY - 40;
      if (left <= right) {
        const lx = bx(left) + boxSize / 2;
        parts.push('<text x="' + lx + '" y="' + ay + '" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--left-color)" text-anchor="middle">▼</text>');
      }
      const rx = bx(right) + boxSize / 2;
      parts.push('<text x="' + rx + '" y="' + ay + '" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--right-color)" text-anchor="middle">▼</text>');
    }

    if (step.type === "final") {
      parts.push('<rect x="335" y="' + (boxY + boxSize / 2 - 17) + '" width="250" height="34" rx="17" fill="rgba(110,231,160,0.10)" stroke="var(--valid)" stroke-width="1.3"/>');
      parts.push('<text x="460" y="' + (boxY + boxSize / 2 + 5) + '" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="var(--valid)" text-anchor="middle">返回子数组个数 = ' + step.ans + '</text>');
    }

    document.getElementById("stage").innerHTML = parts.join("");
  }

  function render() {
    const step = steps[current];

    renderStage(step);
    highlightLines(step.lines);

    document.getElementById("chip-left").textContent = step.left !== undefined ? step.left : "—";
    document.getElementById("chip-right").textContent = (step.right !== undefined && step.right >= 0) ? step.right : "—";
    document.getElementById("chip-cnt").textContent = step.cnt !== undefined ? step.cnt : "—";
    document.getElementById("chip-add").textContent = step.type === "count" ? ("+" + step.add) : "—";
    document.getElementById("chip-ans").textContent = step.ans !== undefined ? step.ans : 0;

    document.getElementById("desc-box").textContent = step.desc;
    document.getElementById("step-counter").textContent = "步骤 " + current + " / " + (steps.length - 1);

    document.getElementById("btn-prev").disabled = current === 0;
    document.getElementById("btn-next").disabled = current === steps.length - 1;
  }

  function stopPlay() {
    if (playTimer) { clearInterval(playTimer); playTimer = null; document.getElementById("btn-play").textContent = "播放"; }
  }

  function reloadWith(numsStr, kVal) {
    stopPlay();
    const parsed = numsStr.split(/[,\s]+/).map((x) => parseInt(x, 10)).filter((x) => !isNaN(x));
    nums = parsed.length ? parsed.slice(0, 12) : [1];
    k = Math.max(1, parseInt(kVal, 10) || 1);
    mx = Math.max(...nums);
    steps = simulate(nums, k);
    current = 0;
    render();
  }

  document.getElementById("btn-run").addEventListener("click", () => {
    reloadWith(document.getElementById("input-nums").value, document.getElementById("input-k").value);
  });

  document.getElementById("btn-next").addEventListener("click", () => {
    if (current < steps.length - 1) { current++; render(); }
    if (current === steps.length - 1) stopPlay();
  });
  document.getElementById("btn-prev").addEventListener("click", () => {
    stopPlay(); if (current > 0) { current--; render(); }
  });
  document.getElementById("btn-reset").addEventListener("click", () => {
    stopPlay(); current = 0; render();
  });
  document.getElementById("btn-play").addEventListener("click", () => {
    if (playTimer) { stopPlay(); return; }
    document.getElementById("btn-play").textContent = "暂停";
    playTimer = setInterval(() => {
      if (current < steps.length - 1) { current++; render(); } else stopPlay();
    }, 1500);
  });
  document.addEventListener("keydown", (e) => {
    const ae = document.activeElement;
    if (ae && (ae.id === "input-nums" || ae.id === "input-k")) return;
    if (e.key === "ArrowRight") document.getElementById("btn-next").click();
    if (e.key === "ArrowLeft") document.getElementById("btn-prev").click();
  });

  render();
})();
</script>
</body>
</html>
