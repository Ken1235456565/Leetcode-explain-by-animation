<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>统计和小于目标的数对 · 双指针分步演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b132b;
    --panel: #121a3a;
    --panel-border: #26315e;
    --ink: #e8eef4;
    --ink-dim: #93a1c2;
    --box: #1a2350;
    --box-dim: #14193a;
    --left-color: #3ddc97;
    --right-color: #f9a826;
    --pair: #5bc0eb;
    --pair-soft: rgba(91,192,235,0.18);
    --lt: #6ee7a0;
    --ge: #f96e6e;
    --accent: #5bc0eb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: radial-gradient(ellipse at top, #101a3f 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    padding: 28px 20px 60px;
    min-height: 100vh;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  header { margin-bottom: 22px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--accent);
    text-transform: uppercase;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 6px 0 4px;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--ink-dim);
    font-size: 14px;
    line-height: 1.6;
  }

  .grid {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 18px;
    margin-top: 22px;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 18px 18px 20px;
  }
  .panel h2 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 12px;
  }

  .stage-svg { width: 100%; height: auto; display: block; }

  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  button {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    background: #1a2350;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 9px 14px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover:not(:disabled) { background: #232d5e; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #051424; border-color: var(--accent); }
  button.primary:hover:not(:disabled) { background: #8fd8f5; }

  .step-counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-dim);
    margin-left: auto;
    white-space: nowrap;
  }

  .desc-box {
    margin-top: 16px;
    padding: 13px 15px;
    background: #0e1636;
    border: 1px solid var(--panel-border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--ink);
    min-height: 78px;
  }

  .chips {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 14px;
  }
  @media (max-width: 560px) {
    .chips { grid-template-columns: repeat(2, 1fr); }
  }
  .chip {
    background: #0e1636;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px 10px;
    text-align: center;
  }
  .chip .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
  }
  .chip .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    font-weight: 700;
    margin-top: 2px;
  }
  .chip.left .value { color: var(--left-color); }
  .chip.right .value { color: var(--right-color); }
  .chip.sum .value { color: var(--accent); }
  .chip.target .value { color: var(--ink); }
  .chip.ans .value { color: var(--lt); }

  .code-box {
    background: #0a1130;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.85;
    overflow-x: auto;
  }
  .line {
    display: flex;
    padding: 0 14px;
    white-space: pre;
    border-left: 3px solid transparent;
    color: #a9b4d6;
  }
  .line .ln {
    width: 26px;
    flex: 0 0 26px;
    color: #4a5580;
    user-select: none;
  }
  .line.active {
    background: rgba(91, 192, 235, 0.12);
    border-left: 3px solid var(--accent);
    color: var(--ink);
  }
  .line.active .ln { color: var(--accent); }

  .legend {
    display: flex;
    gap: 18px;
    margin-top: 14px;
    font-size: 12px;
    color: var(--ink-dim);
    flex-wrap: wrap;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Sorting + Two Pointers · O(n log n) / O(1)</div>
    <h1>统计和小于目标的数对 —— 排序 + 双指针分步演示</h1>
    <div class="sub">数组元素与源代码同步高亮，展示排序后如何用 left / right 双指针一次性统计一批满足条件的数对，而不必逐对枚举。</div>
  </header>

  <div class="grid">

    <div class="panel">
      <h2>数组演示</h2>
      <svg class="stage-svg" viewBox="0 0 920 270" id="stage"></svg>

      <div class="legend">
        <span><i class="dot" style="background:var(--left-color)"></i>left 指针</span>
        <span><i class="dot" style="background:var(--right-color)"></i>right 指针</span>
        <span><i class="dot" style="background:var(--pair)"></i>本步新增的数对区间</span>
      </div>

      <div class="chips">
        <div class="chip left"><div class="label">LEFT</div><div class="value" id="chip-left">-</div></div>
        <div class="chip right"><div class="label">RIGHT</div><div class="value" id="chip-right">-</div></div>
        <div class="chip sum"><div class="label">SUM</div><div class="value" id="chip-sum">-</div></div>
        <div class="chip target"><div class="label">TARGET</div><div class="value" id="chip-target">-</div></div>
        <div class="chip ans"><div class="label">ANS</div><div class="value" id="chip-ans">0</div></div>
      </div>

      <div class="desc-box" id="desc-box">加载中。</div>

      <div class="controls">
        <button id="btn-reset">重置</button>
        <button id="btn-prev">上一步</button>
        <button id="btn-play" class="primary">播放</button>
        <button id="btn-next">下一步</button>
        <div class="step-counter" id="step-counter">步骤 0 / 0</div>
      </div>
    </div>

    <div class="panel">
      <h2>对应源代码</h2>
      <div class="code-box" id="code-box"></div>
    </div>

  </div>
</div>

<script>
(function () {
  const inputNums = [-1, 1, 2, 3, 1];
  const target = 2;

  const codeLines = [
    "class Solution:",
    "    def countPairs(self, nums: List[int], target: int) -> int:",
    "        nums.sort()",
    "        ans = 0",
    "        left = 0",
    "        right = len(nums) - 1",
    "        while left < right:",
    "            if nums[left] + nums[right] < target:",
    "                # left 与 (left, right] 内每个下标都能配成一对",
    "                ans += right - left",
    "                left += 1",
    "            else:",
    "                right -= 1",
    "        return ans"
  ];

  function simulate(input, target) {
    const nums = input.slice().sort((a, b) => a - b);
    const n = nums.length;
    const steps = [];
    let ans = 0, left = 0, right = n - 1;

    steps.push({
      type: "sort", nums: nums.slice(),
      lines: [3],
      desc: "对 nums 排序（非递减），结果为：" + nums.join(", ") + "。排序后，若两端之和已经小于 target，则左端与其间所有元素也都满足。"
    });

    steps.push({
      type: "init", left, right, ans,
      lines: [4, 5, 6],
      desc: "初始化：left 指向下标 0，right 指向最后一个下标 " + right + "，ans 从 0 开始。"
    });

    while (left < right) {
      const s = nums[left] + nums[right];

      if (s < target) {
        const added = right - left;
        ans += added;
        steps.push({
          type: "iter", branch: "lt", left, right, s, added, ans,
          lines: [7, 8, 9, 10, 11],
          desc: "nums[left] + nums[right] = " + nums[left] + " + " + nums[right] + " = " + s +
                "，小于 target(" + target + ")。因为数组已排序，left 与右侧到 right 之间的每个下标都能组成合法数对，一次性增加 " +
                added + " 对（right - left）。随后 left 右移一位。"
        });
        left += 1;
      } else {
        steps.push({
          type: "iter", branch: "ge", left, right, s, ans,
          lines: [7, 8, 12, 13],
          desc: "nums[left] + nums[right] = " + nums[left] + " + " + nums[right] + " = " + s +
                "，不小于 target(" + target + ")。当前 right 太大，right 左移一位以缩小和。"
        });
        right -= 1;
      }
    }

    steps.push({
      type: "final", ans,
      lines: [14],
      desc: "left 不再小于 right，循环结束，返回 ans = " + ans + "，即满足条件的数对总数。"
    });

    return steps;
  }

  const steps = simulate(inputNums, target);
  const sortedNums = steps[0].nums;
  const n = sortedNums.length;
  let current = 0;
  let playTimer = null;

  // ---- code panel ----
  const codeBox = document.getElementById("code-box");
  codeLines.forEach((text, i) => {
    const row = document.createElement("div");
    row.className = "line";
    row.id = "line-" + (i + 1);
    row.innerHTML = '<span class="ln">' + (i + 1) + '</span><span class="code">' + text + "</span>";
    codeBox.appendChild(row);
  });

  function highlightLines(lines) {
    codeLines.forEach((_, i) => {
      document.getElementById("line-" + (i + 1)).classList.remove("active");
    });
    lines.forEach((ln) => {
      const el = document.getElementById("line-" + ln);
      if (el) el.classList.add("active");
    });
  }

  // ---- SVG stage geometry ----
  const boxSize = 64, gap = 20, startX = 90;
  const boxY = 84;

  function boxX(idx) { return startX + idx * (boxSize + gap); }

  function renderStage(step) {
    const parts = [];
    const left = step.left, right = step.right;
    const hasPtr = left !== undefined && right !== undefined && step.type !== "final";

    // highlight the newly counted pair-range band (left+1 .. right) on an "lt" branch
    if (step.branch === "lt") {
      const bx = boxX(left + 1) - gap / 2;
      const bw = (boxX(right) + boxSize) - bx + gap / 2 - gap / 2;
      parts.push(
        '<rect x="' + bx + '" y="' + (boxY - 8) + '" width="' + (boxX(right) + boxSize - bx) + '" height="' + (boxSize + 16) +
        '" rx="12" fill="var(--pair-soft)" stroke="var(--pair)" stroke-width="1.5" stroke-dasharray="6,4"/>'
      );
      parts.push(
        '<text x="' + ((boxX(left + 1) + boxX(right) + boxSize) / 2) + '" y="' + (boxY - 16) +
        '" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="var(--pair)" text-anchor="middle">+' + step.added + ' 对</text>'
      );
    }

    // sum bracket between left and right
    if (step.s !== undefined && hasPtr) {
      const x1 = boxX(left) + boxSize / 2;
      const x2 = boxX(right) + boxSize / 2;
      const bracketY = boxY + boxSize + 46;
      let symColor = "var(--lt)", sym = "<";
      if (step.branch === "ge") { symColor = "var(--ge)"; sym = "≥"; }
      parts.push(
        '<path d="M ' + x1 + ' ' + (boxY + boxSize) + ' L ' + x1 + ' ' + bracketY + ' L ' + x2 + ' ' + bracketY + ' L ' + x2 + ' ' + (boxY + boxSize) +
        '" fill="none" stroke="' + symColor + '" stroke-width="1.5" opacity="0.7"/>'
      );
      parts.push(
        '<text x="' + ((x1 + x2) / 2) + '" y="' + (bracketY + 16) + '" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="' + symColor +
        '" text-anchor="middle">' + sortedNums[left] + ' + ' + sortedNums[right] + ' = ' + step.s + '  ' + sym + '  ' + target + '</text>'
      );
    } else if (step.type === "init") {
      parts.push(
        '<text x="460" y="' + (boxY - 16) + '" font-family="JetBrains Mono, monospace" font-size="12" fill="var(--ink-dim)" text-anchor="middle">target = ' + target + '</text>'
      );
    }

    // boxes
    for (let idx = 0; idx < n; idx++) {
      const x = boxX(idx);
      let inWindow = true;
      if (hasPtr) inWindow = idx >= left && idx <= right;

      let fill = inWindow ? "var(--box)" : "var(--box-dim)";
      let opacity = inWindow ? "1" : "0.35";
      let stroke = "#2c3766";
      let strokeWidth = "1";

      if (idx === left && hasPtr) { stroke = "var(--left-color)"; strokeWidth = "2.5"; }
      else if (idx === right && hasPtr) { stroke = "var(--right-color)"; strokeWidth = "2.5"; }

      parts.push(
        '<rect x="' + x + '" y="' + boxY + '" width="' + boxSize + '" height="' + boxSize +
        '" rx="10" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + strokeWidth + '" opacity="' + opacity + '"/>'
      );
      parts.push(
        '<text x="' + (x + boxSize / 2) + '" y="' + (boxY + boxSize / 2 + 6) + '" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700" fill="var(--ink)" text-anchor="middle" opacity="' + opacity + '">' + sortedNums[idx] + '</text>'
      );
      parts.push(
        '<text x="' + (x + boxSize / 2) + '" y="' + (boxY + boxSize + 18) + '" font-family="JetBrains Mono, monospace" font-size="11" fill="var(--ink-dim)" text-anchor="middle">' + idx + '</text>'
      );
    }

    // pointer arrows
    if (hasPtr) {
      const arrowY = boxY - 30;
      const lx = boxX(left) + boxSize / 2;
      const rx = boxX(right) + boxSize / 2;
      if (step.branch !== "lt") {
        parts.push(
          '<text x="' + lx + '" y="' + arrowY + '" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="var(--left-color)" text-anchor="middle">▼</text>'
        );
        parts.push(
          '<text x="' + lx + '" y="' + (arrowY - 12) + '" font-family="JetBrains Mono, monospace" font-size="11" fill="var(--left-color)" text-anchor="middle">left</text>'
        );
      } else {
        parts.push(
          '<text x="' + lx + '" y="' + (boxY + boxSize + 38) + '" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="var(--left-color)" text-anchor="middle">▲</text>'
        );
        parts.push(
          '<text x="' + lx + '" y="' + (boxY + boxSize + 52) + '" font-family="JetBrains Mono, monospace" font-size="11" fill="var(--left-color)" text-anchor="middle">left</text>'
        );
      }
      parts.push(
        '<text x="' + rx + '" y="' + arrowY + '" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="var(--right-color)" text-anchor="middle">▼</text>'
      );
      parts.push(
        '<text x="' + rx + '" y="' + (arrowY - 12) + '" font-family="JetBrains Mono, monospace" font-size="11" fill="var(--right-color)" text-anchor="middle">right</text>'
      );
    }

    document.getElementById("stage").innerHTML = parts.join("");
  }

  function render() {
    const step = steps[current];

    renderStage(step);
    highlightLines(step.lines);

    document.getElementById("chip-left").textContent = step.left !== undefined ? step.left : "—";
    document.getElementById("chip-right").textContent = step.right !== undefined ? step.right : "—";
    document.getElementById("chip-sum").textContent = step.s !== undefined ? step.s : "—";
    document.getElementById("chip-target").textContent = target;
    document.getElementById("chip-ans").textContent = step.ans !== undefined ? step.ans : (step.type === "sort" ? 0 : "—");

    document.getElementById("desc-box").textContent = step.desc;
    document.getElementById("step-counter").textContent = "步骤 " + current + " / " + (steps.length - 1);

    document.getElementById("btn-prev").disabled = current === 0;
    document.getElementById("btn-next").disabled = current === steps.length - 1;
  }

  function stopPlay() {
    if (playTimer) {
      clearInterval(playTimer);
      playTimer = null;
      document.getElementById("btn-play").textContent = "播放";
    }
  }

  document.getElementById("btn-next").addEventListener("click", () => {
    if (current < steps.length - 1) { current++; render(); }
    if (current === steps.length - 1) stopPlay();
  });

  document.getElementById("btn-prev").addEventListener("click", () => {
    stopPlay();
    if (current > 0) { current--; render(); }
  });

  document.getElementById("btn-reset").addEventListener("click", () => {
    stopPlay();
    current = 0;
    render();
  });

  document.getElementById("btn-play").addEventListener("click", () => {
    if (playTimer) { stopPlay(); return; }
    document.getElementById("btn-play").textContent = "暂停";
    playTimer = setInterval(() => {
      if (current < steps.length - 1) {
        current++;
        render();
      } else {
        stopPlay();
      }
    }, 1500);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") document.getElementById("btn-next").click();
    if (e.key === "ArrowLeft") document.getElementById("btn-prev").click();
  });

  render();
})();
</script>
</body>
</html>
